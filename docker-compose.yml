---
# Local approximation of the Reporting Platform. Every service here has a
# counterpart in OpenShift -- see docs/OPENSHIFT-MAPPING.md, and
# docs/DECISIONS.md for why each is shaped the way it is.
#
# Project name is pinned so container and volume names do not depend on what the
# clone directory happens to be called.
name: reporting-platform

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin123}
  AWS_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: http://minio:9000
  REPORTING_WAREHOUSE: s3a://lakehouse/warehouse
  REPORTING_LANDING: s3a://lakehouse/landing
  NESSIE_URI: http://nessie:19120/api/v2
  # The same version store over Iceberg REST instead of the Nessie API, for
  # scripts/duckdb_console.py. See docs/DECISIONS.md#nessie-iceberg-rest
  NESSIE_ICEBERG_URI: http://nessie:19120/iceberg
  REPORTING_CATALOG: lakehouse
  REPORTING_ENV: ${REPORTING_ENV:-local}
  # The delivery registry (REQ-101). The `platform` database has existed since
  # the first compose file with nothing connected to it; this is its first
  # user. Here rather than on each service's own `environment:` block because
  # four of them redefine that key and so inherit nothing from the anchor
  # above -- the registry is written by the inbox and by every normalize, and
  # read by the console, so one definition merged everywhere is the only shape
  # that cannot drift. `registry/db.py` refuses to run without it rather than
  # defaulting, so a container started before this line was added fails
  # loudly; recreate it, restarting is not enough.
  REGISTRY_DSN: postgresql://platform:platform@postgres:5432/platform

# One place per jar version, from .env. See docs/DECISIONS.md#jar-versions
x-versions: &versions
  ICEBERG_VERSION: ${ICEBERG_VERSION:-1.6.1}
  NESSIE_SPARK_EXT_VERSION: ${NESSIE_SPARK_EXT_VERSION:-0.99.0}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      NESSIE_SERVER_VERSION: ${NESSIE_SERVER_VERSION:-0.99.0}
  # RUN AS THE HOST USER, IN GROUP 0. Set AIRFLOW_UID in .env to your own
  # `id -u`; `.env.example` says how and why.
  #
  # Half the bind mounts here are READ-WRITE by design -- the feed console
  # writes feeds.yml, the dbt sources and a scaffolded model; the inbox
  # watcher creates `.processed/` and moves files into it -- and a bind mount
  # keeps the HOST's ownership, which no `chown` in the image can reach. As
  # uid 50000 the container could not write any of them, and the symptom was
  # never "permissions": it was a 500 from the console with the traceback only
  # in `docker compose logs`, and an inbox watcher that uploaded a delivery
  # correctly and then died moving the file.
  #
  # The group stays 0 and that is the load-bearing half. Everything the image
  # needs to write -- /home/airflow, /opt/airflow/logs, /opt/platform/run and
  # the named volumes under it -- is owned `airflow:0` with `g+rwX`
  # (Dockerfile.airflow's last layer says so explicitly), which is precisely
  # the arrangement that lets an ARBITRARY uid run this image. So the uid may
  # change freely; the gid may not.
  #
  # Default 50000 keeps the previous behaviour for anyone with no .env entry.
  user: "${AIRFLOW_UID:-50000}:0"
  environment:
    # A sequence: YAML allows only one merge key per mapping and this block
    # needs both anchors. Neither defines a key the other does.
    <<: [*s3-env, *versions]
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://platform:platform@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-not-a-real-secret
    # basic_auth as well as session, or the feed console's API calls 401 against
    # a healthy webserver. See docs/DECISIONS.md#airflow-api-auth
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    # Must not diverge from spark.master in dbt/profiles.yml.
    # See docs/DECISIONS.md#spark-master-single-source
    SPARK_MASTER: spark://spark-master:7077
    DBT_PROJECT_DIR: /opt/platform/dbt
    DBT_PROFILES_DIR: /opt/platform/dbt
    # Off the ./dbt bind mount, whose ownership comes from the host.
    # See docs/DECISIONS.md#dbt-working-directories
    DBT_LOG_PATH: /opt/platform/run/dbt/logs
    DBT_TARGET_PATH: /opt/platform/run/dbt/target
    # Every dbt target is a Spark one; this selects which. dbt_builds.py refuses
    # a non-Spark value. See docs/DECISIONS.md#duckdb-is-not-an-engine
    DBT_TARGET: ${DBT_TARGET:-spark_local}
    PYTHONPATH: /opt/platform
    # OPENLINEAGE -> MARQUEZ. On the anchor, so the scheduler, webserver and
    # triggerer all get it and none of them can disagree; the four services
    # that REPLACE this block wholesale (feed-ui, notebook, inbox, watchdog)
    # deliberately do not, because none of them runs a DAG task and the
    # provider only emits from the process that does.
    #
    # DISABLED BY DEFAULT, and that is the interlock. Marquez is behind the
    # `lineage` compose profile, so on an ordinary `docker compose up` there
    # is nothing listening on marquez-api:5000. The provider's HTTP transport
    # retries and logs on a refused connection rather than failing the task,
    # but a nightly chain that emits several hundred failed POSTs is noise
    # that trains people to ignore task logs. One variable turns both on
    # together -- see .env.example.
    #
    # apache-airflow-providers-openlineage is ALREADY in the image (2.0.0,
    # openlineage-python 1.27.0) as a transitive dependency. Do NOT install it
    # explicitly under Airflow's constraint file: that pins
    # typing_extensions==4.12.2, and dbt's mashumaro needs evaluate_forward_ref
    # from 4.13+. Verified by dry run -- it is the cosmos trap exactly.
    # See docs/DECISIONS.md#openlineage-is-an-export-not-a-record
    AIRFLOW__OPENLINEAGE__DISABLED: ${OPENLINEAGE_DISABLED:-true}
    AIRFLOW__OPENLINEAGE__NAMESPACE: ${OPENLINEAGE_NAMESPACE:-reporting-platform-local}
    # One line deliberately: a folded scalar whose continuation is indented
    # further keeps the newline (YAML's more-indented-line rule). JSON tolerates
    # it, so this was working and looked wrong, which is the worst combination.
    AIRFLOW__OPENLINEAGE__TRANSPORT: '{"type": "http", "url": "http://marquez-api:5000", "endpoint": "api/v1/lineage", "timeout": 5}'
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./reporting_platform:/opt/platform/reporting_platform
    - ./scripts:/opt/platform/scripts
    # The config-level tests, so `python -m tests.run` works in the container
    # as tests/README.md says. Read-only: they must never be able to edit the
    # thing they are testing.
    - ./tests:/opt/platform/tests:ro
    - ./dbt:/opt/platform/dbt
    - ./seed:/opt/platform/seed
    # Clean restatement of the same history, for a build that passes its tests
    # and can be published. See docs/DECISIONS.md#seed-clean
    - ./seed_clean:/opt/platform/seed_clean
    - airflow-logs:/opt/airflow/logs
    # dbt's installed packages, shared by every service. Mounted one level ABOVE
    # dbt_packages on purpose. See docs/DECISIONS.md#dbt-packages-volume
    - dbt-packages:/opt/platform/run/packages
  depends_on:
    postgres: {condition: service_healthy}
    nessie: {condition: service_healthy}
    minio-init: {condition: service_completed_successfully}

services:

  # ---------------------------------------------------------------- storage
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    # Host side only, and defaulted away from 9000/9001 because those collide
    # with ZScaler and friends. See docs/DECISIONS.md#minio-host-ports
    ports:
      - "${MINIO_API_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin123};
      mc mb --ignore-existing local/lakehouse;
      echo 'bucket ready';
      "
    # THE BUCKET ONLY. `landing/` and `warehouse/` are PREFIXES, not
    # directories -- S3 has no directories, and a prefix exists exactly when
    # an object whose key starts with it exists. `mc mb local/lakehouse/landing`
    # therefore could not create one; what it actually did was PUT a zero-byte
    # object whose key is literally `landing/`, a "folder marker" that makes
    # the MinIO console draw a folder icon.
    #
    # Those markers are a small lie with a real cost: they are objects that no
    # feed owns, no `filename_pattern` matches and nothing reads, so any sweep
    # over the bare `landing/` prefix counts them as unrecognised objects it
    # must never delete. `retention/landing.py` and `retention/orphan_storage.py`
    # both happen to miss them today -- the first is scoped to
    # `landing/<feed>/`, the second skips keys with fewer than four segments --
    # which is luck, not design, and exactly the kind of thing a later
    # bucket-wide sweep would trip over.
    #
    # Nothing needs them. Iceberg writes through `S3FileIO`, which PUTs keys
    # directly and has no notion of a parent directory, and the only S3A use is
    # READING landing CSVs that already exist. Verified by creating a bucket
    # with no prefixes at all and building a table into it.
    # See docs/DECISIONS.md#no-folder-markers

  # ------------------------------------------------------- catalog + stores
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  nessie:
    # Kept equal to Dockerfile.airflow's nessie-gc jar; may be newer than the
    # Spark extensions. See docs/DECISIONS.md#jar-versions
    image: ghcr.io/projectnessie/nessie:${NESSIE_SERVER_VERSION:-0.99.0}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      nessie.version.store.type: JDBC
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/nessie
      quarkus.datasource.username: platform
      quarkus.datasource.password: platform

      # Iceberg REST: a second front door onto the same version store, for the
      # DuckDB console only. See docs/DECISIONS.md#nessie-iceberg-rest
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://lakehouse/warehouse
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${S3_ACCESS_KEY:-minioadmin}
      nessie.catalog.secrets.access-key.secret: ${S3_SECRET_KEY:-minioadmin123}
    ports: ["${NESSIE_HOST_PORT:-19120}:19120"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- compute
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
      args: *versions
    command: /opt/spark/sbin/start-master.sh
    environment:
      <<: *s3-env
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
    ports:
      - "${SPARK_MASTER_HOST_PORT:-7077}:7077"
      - "${SPARK_UI_HOST_PORT:-8080}:8080"
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy-cache:/opt/spark/.ivy2
    depends_on:
      nessie: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
      args: *versions
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    environment:
      <<: *s3-env
      SPARK_NO_DAEMONIZE: "true"
      # Sized so three capped applications can hold cores at once.
      # See docs/DECISIONS.md#spark-worker-sizing
      SPARK_WORKER_CORES: "6"
      SPARK_WORKER_MEMORY: "6g"
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy-cache:/opt/spark/.ivy2
    depends_on: [spark-master]

  # ---------------------------------------------------------- orchestration
  # Airflow 2.x, split into its real components rather than `airflow
  # standalone`. See docs/DECISIONS.md#airflow-2-not-3

  airflow-init:
    <<: *airflow-common
    # Runs once; everything else waits on it COMPLETING. Five steps, each of
    # which once broke the platform silently when skipped.
    #
    # The registry schema is here so a cold stack has its tables before any
    # DAG parses. `registry/db.py` also ensures it on first connect, and that
    # is not redundant: `inbox`, `feed-ui` and `watchdog` share this image but
    # not this container's `depends_on`, so they can be up and recording
    # deliveries while this has never run.
    # See docs/DECISIONS.md#airflow-init-four-things
    command: >
      bash -euc "
      airflow db migrate &&
      { airflow users create --username admin --password admin --firstname Platform --lastname Admin --role Admin --email admin@example.invalid || true; } &&
      { airflow pools set lakehouse_write 1 'serialise all Iceberg writers, incl. maintenance' || true; } &&
      python -m reporting_platform.registry schema &&
      dbt deps --project-dir /opt/platform/dbt --profiles-dir /opt/platform/dbt
      "
    restart: "no"

  airflow:
    <<: *airflow-common
    # scheduler == task execution under LocalExecutor
    command: airflow scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports: ["${AIRFLOW_HOST_PORT:-8081}:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-triggerer:
    <<: *airflow-common
    command: airflow triggerer
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  # ----------------------------------------------------------- feed console
  # Add/edit a feed, land it, ingest it, watch the builds: http://localhost:8082
  # See docs/FEED-UI.md and docs/DECISIONS.md#feed-ui-same-image
  feed-ui:
    <<: *airflow-common
    command: python -m reporting_platform.ui
    environment:
      # A service's own `environment:` REPLACES the anchored one wholesale --
      # YAML's merge key is shallow -- so everything this block needs is
      # restated here.
      <<: [*s3-env, *versions]
      PYTHONPATH: /opt/platform
      PYTHONUNBUFFERED: "1"
      DBT_PROJECT_DIR: /opt/platform/dbt
      DBT_PROFILES_DIR: /opt/platform/dbt
      DBT_LOG_PATH: /opt/platform/run/dbt/logs
      DBT_TARGET_PATH: /opt/platform/run/dbt/target
      REPORTING_SEED_DIR: /opt/platform/seed
      SPARK_MASTER: spark://spark-master:7077
      DBT_TARGET: ${DBT_TARGET:-spark_local}
      # The console's onboarding sniffer (ingest/sniff.py, unclaimed
      # deliveries in .rejected/) fetches bytes with boto3 -- the same
      # client ingest/arrival.py already uses -- rather than through
      # DuckDB's own S3 support, so it needs no REPORTING_DUCKDB_S3_SECRET.
      # An earlier draft set it here on the assumption the sniffer would
      # read `s3://...` directly; it does not, so it was removed rather
      # than left as a setting nothing reads.
      REPORTING_INBOX: /opt/platform/inbox
      # Host-side URLs, rendered for the BROWSER -- nothing inside the network
      # otherwise knows the host mapping.
      MINIO_CONSOLE_URL: http://localhost:${MINIO_CONSOLE_HOST_PORT:-19001}
      AIRFLOW_UI_URL: http://localhost:${AIRFLOW_HOST_PORT:-8081}
      SPARK_UI_URL: http://localhost:${SPARK_UI_HOST_PORT:-8080}
      NESSIE_UI_URL: http://localhost:${NESSIE_HOST_PORT:-19120}
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_API_USER: admin
      AIRFLOW_API_PASSWORD: admin
    # A service's own `volumes:` also REPLACES the anchored one wholesale, so
    # this restates x-airflow-common's list and adds one: `./inbox`, READ-ONLY,
    # so the console's unclaimed-deliveries queue can list and sniff whatever
    # is sitting in `.rejected/` -- inbox.py itself keeps the read-write mount,
    # since it is the one that moves files into that folder.
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - ./reporting_platform:/opt/platform/reporting_platform
      - ./scripts:/opt/platform/scripts
      - ./tests:/opt/platform/tests:ro
      - ./dbt:/opt/platform/dbt
      - ./seed:/opt/platform/seed
      - ./seed_clean:/opt/platform/seed_clean
      - airflow-logs:/opt/airflow/logs
      - dbt-packages:/opt/platform/run/packages
      - ./inbox:/opt/platform/inbox:ro
    ports: ["${FEED_UI_HOST_PORT:-8082}:8082"]
    restart: unless-stopped

  # ------------------------------------------------------------- notebook
  # Marimo exploration notebook, read-only: http://localhost:8083
  # See docs/DECISIONS.md#notebook-service
  notebook:
    <<: *airflow-common
    # `python -m marimo`, not `marimo`: the image's entrypoint would read a bare
    # `marimo` as an airflow subcommand.
    # See docs/DECISIONS.md#marimo-not-jupyter
    command: >
      python -m marimo edit /opt/platform/notebooks
      --host 0.0.0.0 --port 8083 --headless --no-token
    environment:
      <<: *s3-env
      PYTHONPATH: /opt/platform
      PYTHONUNBUFFERED: "1"
      REPORTING_DUCKDB_S3_SECRET: "1"
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform:ro
      - ./scripts:/opt/platform/scripts:ro
      - ./dbt:/opt/platform/dbt:ro
      - ./notebooks:/opt/platform/notebooks
    ports: ["${NOTEBOOK_HOST_PORT:-8083}:8083"]
    restart: unless-stopped

  # --------------------------------------------------------------- inbox
  # Drop a file into ./inbox on the host and it lands, ingests, and moves to
  # inbox/.processed/<feed>/. Routed by the feeds' own filename patterns, so
  # nothing here repeats feeds.yml.
  #
  # POLLED, not inotify: filesystem events do not cross a Docker Desktop bind
  # mount, so an event-driven watcher would sit here healthy and idle while
  # files piled up. See reporting_platform/ingest/inbox.py.
  inbox:
    <<: *airflow-common
    command: python -m reporting_platform.ingest.inbox --loop 10
    environment:
      <<: *s3-env
      PYTHONPATH: /opt/platform
      PYTHONUNBUFFERED: "1"
      REPORTING_INBOX: /opt/platform/inbox
      # It triggers the ingest DAG through the same API the console uses.
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_API_USER: admin
      AIRFLOW_API_PASSWORD: admin
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform:ro
      - ./scripts:/opt/platform/scripts:ro
      # READ-WRITE: the watcher moves each file into .processed/ or .rejected/
      # once it has dealt with it, which is what stops it reprocessing.
      - ./inbox:/opt/platform/inbox
    restart: unless-stopped

  # ------------------------------------------------------------- watchdog
  # Deliberately NOT an Airflow service and in no depends_on with one.
  # See docs/DECISIONS.md#watchdog-independent
  watchdog:
    <<: *airflow-common
    command: python -m reporting_platform.monitoring.watchdog --loop 300
    environment:
      <<: *s3-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://platform:platform@postgres:5432/airflow
      PYTHONPATH: /opt/platform
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform
      - ./scripts:/opt/platform/scripts
      # READ-ONLY, and needed only so check_orphan_tables can ask what the
      # platform declares: managed_tables() derives the prepared and reporting
      # sets from this directory. See docs/DECISIONS.md#managed-tables-are-derived
      - ./dbt:/opt/platform/dbt:ro
      # Bind mount, not a named volume: a fresh named volume is root-owned and
      # this runs as `airflow`. Also readable without entering a container.
      - ./var/watchdog:/var/lib/reporting-watchdog
    restart: unless-stopped

  # ------------------------------------------------------------------ lineage
  # MARQUEZ: a CONSUMER of the OpenLineage events Airflow emits, and nothing
  # more. It is not an authority on this platform and must not become one --
  # `feeds_behind_report()` derives lineage from the dbt project and RETENTION
  # REFUSES TO SWEEP on its answer, so a second graph that drifts is the exact
  # failure this repo keeps rejecting. Marquez observes; the dbt project
  # decides. See docs/DECISIONS.md#openlineage-is-an-export-not-a-record
  #
  # BEHIND A PROFILE, so it is opt-in: `docker compose --profile lineage up -d`.
  # This stack already runs twelve services and the host it was built on had
  # ~6 GB free; two more that are useful only when somebody is looking at them
  # should not be in the default set.
  marquez-api:
    image: marquezproject/marquez:${MARQUEZ_VERSION:-0.51.1}
    profiles: ["lineage"]
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # Host and port only. The image's marquez.dev.yml HARDCODES the database
      # name, user and password to `marquez`, so the role exists in
      # scripts/init-postgres.sql rather than reusing `platform`.
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      MARQUEZ_PORT: 5000
      MARQUEZ_ADMIN_PORT: 5001
      # OFF, AND THIS IS THE WHOLE REASON THIS FITS. marquez.dev.yml defaults
      # `search.enabled` to true against an OpenSearch on :9200 -- which is the
      # 2 GB component that makes a full catalogue deployment too heavy for
      # this host. Search is a nice-to-have; lineage is the point.
      SEARCH_ENABLED: "false"
      JAVA_OPTS: -Xmx512m
    ports:
      - "${MARQUEZ_API_HOST_PORT:-15000}:5000"
      - "${MARQUEZ_ADMIN_HOST_PORT:-15001}:5001"
    # 5000/5001/3000 are all taken on a developer box running anything else --
    # grafana owns 3000 on the machine this was built on. Container-internal
    # ports are unchanged, so Airflow still reaches marquez-api:5000.
    mem_limit: 900m
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/healthcheck || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  marquez-web:
    image: marquezproject/marquez-web:${MARQUEZ_VERSION:-0.51.1}
    profiles: ["lineage"]
    depends_on:
      marquez-api: {condition: service_healthy}
    environment:
      # All three are MANDATORY -- setupProxy.js calls process.exit(1) on any
      # one of them being unset, which presents as a container that starts and
      # immediately dies with nothing obviously wrong.
      MARQUEZ_HOST: marquez-api
      MARQUEZ_PORT: "5000"
      WEB_PORT: "3000"
    ports: ["${MARQUEZ_WEB_HOST_PORT:-13000}:3000"]
    mem_limit: 256m

volumes:
  minio-data:
  pg-data:
  airflow-logs:
  ivy-cache:
  dbt-packages:

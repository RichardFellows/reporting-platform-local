---
# Local approximation of the Reporting Platform. Every service here has a
# counterpart in OpenShift -- see docs/OPENSHIFT-MAPPING.md, and
# docs/DECISIONS.md for why each is shaped the way it is.
#
# Project name is pinned so container and volume names do not depend on what the
# clone directory happens to be called.
name: reporting-platform

x-s3-env: &s3-env
  AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY:-minioadmin}
  AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY:-minioadmin123}
  AWS_REGION: ${S3_REGION:-us-east-1}
  S3_ENDPOINT: http://minio:9000
  REPORTING_WAREHOUSE: s3a://lakehouse/warehouse
  REPORTING_LANDING: s3a://lakehouse/landing
  NESSIE_URI: http://nessie:19120/api/v2
  # The same version store over Iceberg REST instead of the Nessie API, for
  # scripts/duckdb_console.py. See docs/DECISIONS.md#nessie-iceberg-rest
  NESSIE_ICEBERG_URI: http://nessie:19120/iceberg
  REPORTING_CATALOG: lakehouse
  REPORTING_ENV: ${REPORTING_ENV:-local}

# One place per jar version, from .env. See docs/DECISIONS.md#jar-versions
x-versions: &versions
  ICEBERG_VERSION: ${ICEBERG_VERSION:-1.6.1}
  NESSIE_SPARK_EXT_VERSION: ${NESSIE_SPARK_EXT_VERSION:-0.99.0}

x-airflow-common: &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
    args:
      NESSIE_SERVER_VERSION: ${NESSIE_SERVER_VERSION:-0.99.0}
  environment:
    # A sequence: YAML allows only one merge key per mapping and this block
    # needs both anchors. Neither defines a key the other does.
    <<: [*s3-env, *versions]
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://platform:platform@postgres:5432/airflow
    AIRFLOW__CORE__DAGS_FOLDER: /opt/airflow/dags
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__WEBSERVER__SECRET_KEY: local-dev-not-a-real-secret
    # basic_auth as well as session, or the feed console's API calls 401 against
    # a healthy webserver. See docs/DECISIONS.md#airflow-api-auth
    AIRFLOW__API__AUTH_BACKENDS: "airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session"
    # Must not diverge from spark.master in dbt/profiles.yml.
    # See docs/DECISIONS.md#spark-master-single-source
    SPARK_MASTER: spark://spark-master:7077
    DBT_PROJECT_DIR: /opt/platform/dbt
    DBT_PROFILES_DIR: /opt/platform/dbt
    # Off the ./dbt bind mount, whose ownership comes from the host.
    # See docs/DECISIONS.md#dbt-working-directories
    DBT_LOG_PATH: /opt/platform/run/dbt/logs
    DBT_TARGET_PATH: /opt/platform/run/dbt/target
    # Every dbt target is a Spark one; this selects which. dbt_builds.py refuses
    # a non-Spark value. See docs/DECISIONS.md#duckdb-is-not-an-engine
    DBT_TARGET: ${DBT_TARGET:-spark_local}
    PYTHONPATH: /opt/platform
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./reporting_platform:/opt/platform/reporting_platform
    - ./scripts:/opt/platform/scripts
    # The config-level tests, so `python -m tests.run` works in the container
    # as tests/README.md says. Read-only: they must never be able to edit the
    # thing they are testing.
    - ./tests:/opt/platform/tests:ro
    - ./dbt:/opt/platform/dbt
    - ./seed:/opt/platform/seed
    # Clean restatement of the same history, for a build that passes its tests
    # and can be published. See docs/DECISIONS.md#seed-clean
    - ./seed_clean:/opt/platform/seed_clean
    - airflow-logs:/opt/airflow/logs
    # dbt's installed packages, shared by every service. Mounted one level ABOVE
    # dbt_packages on purpose. See docs/DECISIONS.md#dbt-packages-volume
    - dbt-packages:/opt/platform/run/packages
  depends_on:
    postgres: {condition: service_healthy}
    nessie: {condition: service_healthy}
    minio-init: {condition: service_completed_successfully}

services:

  # ---------------------------------------------------------------- storage
  minio:
    image: minio/minio:RELEASE.2024-09-22T00-33-43Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-minioadmin123}
    # Host side only, and defaulted away from 9000/9001 because those collide
    # with ZScaler and friends. See docs/DECISIONS.md#minio-host-ports
    ports:
      - "${MINIO_API_HOST_PORT:-19000}:9000"
      - "${MINIO_CONSOLE_HOST_PORT:-19001}:9001"
    volumes: ["minio-data:/data"]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:RELEASE.2024-09-16T17-43-14Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY:-minioadmin} ${S3_SECRET_KEY:-minioadmin123};
      mc mb --ignore-existing local/lakehouse;
      mc mb --ignore-existing local/lakehouse/landing;
      mc mb --ignore-existing local/lakehouse/warehouse;
      echo 'buckets ready';
      "

  # ------------------------------------------------------- catalog + stores
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: platform
      POSTGRES_DB: platform
    ports: ["${POSTGRES_HOST_PORT:-5432}:5432"]
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./scripts/init-postgres.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform"]
      interval: 5s
      timeout: 5s
      retries: 20

  nessie:
    # Kept equal to Dockerfile.airflow's nessie-gc jar; may be newer than the
    # Spark extensions. See docs/DECISIONS.md#jar-versions
    image: ghcr.io/projectnessie/nessie:${NESSIE_SERVER_VERSION:-0.99.0}
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      nessie.version.store.type: JDBC
      quarkus.datasource.jdbc.url: jdbc:postgresql://postgres:5432/nessie
      quarkus.datasource.username: platform
      quarkus.datasource.password: platform

      # Iceberg REST: a second front door onto the same version store, for the
      # DuckDB console only. See docs/DECISIONS.md#nessie-iceberg-rest
      nessie.catalog.default-warehouse: warehouse
      nessie.catalog.warehouses.warehouse.location: s3://lakehouse/warehouse
      nessie.catalog.service.s3.default-options.region: us-east-1
      nessie.catalog.service.s3.default-options.endpoint: http://minio:9000
      nessie.catalog.service.s3.default-options.path-style-access: "true"
      nessie.catalog.service.s3.default-options.access-key: urn:nessie-secret:quarkus:nessie.catalog.secrets.access-key
      nessie.catalog.secrets.access-key.name: ${S3_ACCESS_KEY:-minioadmin}
      nessie.catalog.secrets.access-key.secret: ${S3_SECRET_KEY:-minioadmin123}
    ports: ["${NESSIE_HOST_PORT:-19120}:19120"]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:19120/api/v2/config"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------------------------------------------------------------- compute
  spark-master:
    build:
      context: .
      dockerfile: Dockerfile.spark
      args: *versions
    command: /opt/spark/sbin/start-master.sh
    environment:
      <<: *s3-env
      SPARK_NO_DAEMONIZE: "true"
      SPARK_MASTER_HOST: spark-master
    ports:
      - "${SPARK_MASTER_HOST_PORT:-7077}:7077"
      - "${SPARK_UI_HOST_PORT:-8080}:8080"
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy-cache:/opt/spark/.ivy2
    depends_on:
      nessie: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}

  spark-worker:
    build:
      context: .
      dockerfile: Dockerfile.spark
      args: *versions
    command: /opt/spark/sbin/start-worker.sh spark://spark-master:7077
    environment:
      <<: *s3-env
      SPARK_NO_DAEMONIZE: "true"
      # Sized so three capped applications can hold cores at once.
      # See docs/DECISIONS.md#spark-worker-sizing
      SPARK_WORKER_CORES: "6"
      SPARK_WORKER_MEMORY: "6g"
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform:ro
      - ./conf/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
      - ivy-cache:/opt/spark/.ivy2
    depends_on: [spark-master]

  # ---------------------------------------------------------- orchestration
  # Airflow 2.x, split into its real components rather than `airflow
  # standalone`. See docs/DECISIONS.md#airflow-2-not-3

  airflow-init:
    <<: *airflow-common
    # Runs once; everything else waits on it COMPLETING. Four steps, each of
    # which once broke the platform silently when skipped.
    # See docs/DECISIONS.md#airflow-init-four-things
    command: >
      bash -euc "
      airflow db migrate &&
      { airflow users create --username admin --password admin --firstname Platform --lastname Admin --role Admin --email admin@example.invalid || true; } &&
      { airflow pools set lakehouse_write 1 'serialise all Iceberg writers, incl. maintenance' || true; } &&
      dbt deps --project-dir /opt/platform/dbt --profiles-dir /opt/platform/dbt
      "
    restart: "no"

  airflow:
    <<: *airflow-common
    # scheduler == task execution under LocalExecutor
    command: airflow scheduler
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-webserver:
    <<: *airflow-common
    command: airflow webserver
    ports: ["${AIRFLOW_HOST_PORT:-8081}:8080"]
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  airflow-triggerer:
    <<: *airflow-common
    command: airflow triggerer
    depends_on:
      airflow-init: {condition: service_completed_successfully}

  # ----------------------------------------------------------- feed console
  # Add/edit a feed, land it, ingest it, watch the builds: http://localhost:8082
  # See docs/FEED-UI.md and docs/DECISIONS.md#feed-ui-same-image
  feed-ui:
    <<: *airflow-common
    command: python -m reporting_platform.ui
    environment:
      # A service's own `environment:` REPLACES the anchored one wholesale --
      # YAML's merge key is shallow -- so everything this block needs is
      # restated here.
      <<: [*s3-env, *versions]
      PYTHONPATH: /opt/platform
      PYTHONUNBUFFERED: "1"
      DBT_PROJECT_DIR: /opt/platform/dbt
      DBT_PROFILES_DIR: /opt/platform/dbt
      DBT_LOG_PATH: /opt/platform/run/dbt/logs
      DBT_TARGET_PATH: /opt/platform/run/dbt/target
      REPORTING_SEED_DIR: /opt/platform/seed
      SPARK_MASTER: spark://spark-master:7077
      DBT_TARGET: ${DBT_TARGET:-spark_local}
      # So reporting_platform/ingest/sniff.py (docs/DELIVERY-SHAPES.md step 5)
      # can read `s3://lakehouse/...` directly through the same DuckDB
      # connection recipe the notebook service uses -- see
      # scripts/duckdb_console.py:connect(). Nothing here uses it yet; this
      # is the prerequisite, not the wiring.
      REPORTING_DUCKDB_S3_SECRET: "1"
      # Host-side URLs, rendered for the BROWSER -- nothing inside the network
      # otherwise knows the host mapping.
      MINIO_CONSOLE_URL: http://localhost:${MINIO_CONSOLE_HOST_PORT:-19001}
      AIRFLOW_UI_URL: http://localhost:${AIRFLOW_HOST_PORT:-8081}
      SPARK_UI_URL: http://localhost:${SPARK_UI_HOST_PORT:-8080}
      NESSIE_UI_URL: http://localhost:${NESSIE_HOST_PORT:-19120}
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_API_USER: admin
      AIRFLOW_API_PASSWORD: admin
    ports: ["${FEED_UI_HOST_PORT:-8082}:8082"]
    restart: unless-stopped

  # ------------------------------------------------------------- notebook
  # Marimo exploration notebook, read-only: http://localhost:8083
  # See docs/DECISIONS.md#notebook-service
  notebook:
    <<: *airflow-common
    # `python -m marimo`, not `marimo`: the image's entrypoint would read a bare
    # `marimo` as an airflow subcommand.
    # See docs/DECISIONS.md#marimo-not-jupyter
    command: >
      python -m marimo edit /opt/platform/notebooks
      --host 0.0.0.0 --port 8083 --headless --no-token
    environment:
      <<: *s3-env
      PYTHONPATH: /opt/platform
      PYTHONUNBUFFERED: "1"
      REPORTING_DUCKDB_S3_SECRET: "1"
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform:ro
      - ./scripts:/opt/platform/scripts:ro
      - ./dbt:/opt/platform/dbt:ro
      - ./notebooks:/opt/platform/notebooks
    ports: ["${NOTEBOOK_HOST_PORT:-8083}:8083"]
    restart: unless-stopped

  # --------------------------------------------------------------- inbox
  # Drop a file into ./inbox on the host and it lands, ingests, and moves to
  # inbox/.processed/<feed>/. Routed by the feeds' own filename patterns, so
  # nothing here repeats feeds.yml.
  #
  # POLLED, not inotify: filesystem events do not cross a Docker Desktop bind
  # mount, so an event-driven watcher would sit here healthy and idle while
  # files piled up. See reporting_platform/ingest/inbox.py.
  inbox:
    <<: *airflow-common
    command: python -m reporting_platform.ingest.inbox --loop 10
    environment:
      <<: *s3-env
      PYTHONPATH: /opt/platform
      PYTHONUNBUFFERED: "1"
      REPORTING_INBOX: /opt/platform/inbox
      # It triggers the ingest DAG through the same API the console uses.
      AIRFLOW_API_URL: http://airflow-webserver:8080/api/v1
      AIRFLOW_API_USER: admin
      AIRFLOW_API_PASSWORD: admin
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform:ro
      - ./scripts:/opt/platform/scripts:ro
      # READ-WRITE: the watcher moves each file into .processed/ or .rejected/
      # once it has dealt with it, which is what stops it reprocessing.
      - ./inbox:/opt/platform/inbox
    restart: unless-stopped

  # ------------------------------------------------------------- watchdog
  # Deliberately NOT an Airflow service and in no depends_on with one.
  # See docs/DECISIONS.md#watchdog-independent
  watchdog:
    <<: *airflow-common
    command: python -m reporting_platform.monitoring.watchdog --loop 300
    environment:
      <<: *s3-env
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://platform:platform@postgres:5432/airflow
      PYTHONPATH: /opt/platform
      PYTHONUNBUFFERED: "1"
    volumes:
      - ./reporting_platform:/opt/platform/reporting_platform
      - ./scripts:/opt/platform/scripts
      # READ-ONLY, and needed only so check_orphan_tables can ask what the
      # platform declares: managed_tables() derives the prepared and reporting
      # sets from this directory. See docs/DECISIONS.md#managed-tables-are-derived
      - ./dbt:/opt/platform/dbt:ro
      # Bind mount, not a named volume: a fresh named volume is root-owned and
      # this runs as `airflow`. Also readable without entering a container.
      - ./var/watchdog:/var/lib/reporting-watchdog
    restart: unless-stopped

volumes:
  minio-data:
  pg-data:
  airflow-logs:
  ivy-cache:
  dbt-packages:

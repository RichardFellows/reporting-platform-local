# THIS DIRECTORY DELIBERATELY CONTAINS NO MODELS.
#
# dbt does not build the raw layer and cannot: `ingest_feed.py` creates the
# table (ensure_raw_table) and writes it (`df.writeTo(...).append()`), per
# file, on its own Nessie branch, driven by arrival rather than by a build.
# The load is imperative -- schema reconciliation into `_extra_columns`, a
# MAX+1 `_file_version` lookup, `_row_number` over file order, an abort below
# `expected_min_rows` -- not a SELECT, so there is nothing here for dbt to
# materialise. In dbt's terms raw is a SOURCE: data that arrived by other
# means.
#
# It lives in its own folder anyway so the file tree mirrors the layer model
# in docs/ARCHITECTURE.md (raw -> prepared -> reporting) rather than filing
# raw under the layer that happens to consume it. dbt scans every path under
# `model-paths` for YAML, and source config in dbt_project.yml is keyed by
# project name rather than by directory, so the location is free.
#
# Do NOT add a `raw:` key under `models:` in dbt_project.yml to match the
# other two layers. That key configures MODELS in a directory; with none here
# it applies to nothing and dbt warns about it on every invocation.
#
# dbt still reads and tests raw -- the not_null tests below run against the
# landed strings, before any modelling, and source freshness is what makes a
# late feed visible instead of silently carried forward.

version: 2

sources:
  - name: raw
    description: >
      1:1 landing of upstream CSVs. Every column is STRING by design; all
      casting happens in prepared so that a bad value fails a TEST rather
      than a LOAD.
    # NOTE: no `database:` here on purpose. dbt-spark's SparkRelation
    # raises "Cannot set database in spark!" whenever database is set and
    # differs from schema -- it only supports a 2-level schema.table
    # namespace. spark.sql.defaultCatalog=lakehouse (set in profiles.yml) makes
    # unqualified `raw.trade` etc. resolve against the lakehouse/Nessie catalog
    # instead.
    schema: raw
    loaded_at_field: _ingest_ts

    freshness:
      # A feed that is late is a warning, not a hard stop — downstream carries
      # forward the last good version. Error only once it is clearly broken.
      warn_after: {count: 26, period: hour}
      error_after: {count: 50, period: hour}

    tables:
      - name: trade
        description: Daily position-level trade extract from the front office (TRADE_SRC).
        columns:
          - name: trade_id
            tests: [not_null]
          - name: counterparty_id
            tests: [not_null]

      - name: counterparty
        description: Counterparty reference data from CPTY_SRC.
        columns:
          - name: counterparty_id
            tests: [not_null]

      - name: rating
        description: External agency credit ratings from RATING_SRC.
        # Ratings are not redelivered daily by every agency; relax freshness.
        freshness:
          warn_after: {count: 3, period: day}
          error_after: {count: 10, period: day}

      - name: primary_limits
        description: Primary credit limits per counterparty and limit type, from GCIS2.
        columns:
          - name: limit_id
            tests: [not_null]
          - name: counterparty_id
            tests: [not_null]

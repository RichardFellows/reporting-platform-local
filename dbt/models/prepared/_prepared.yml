version: 2

models:
  - name: ref_counterparty
    description: >
      Conformed counterparty reference. The single shared representation —
      every report that needs a counterparty attribute ref()s this, so
      divergence between apps shows up in the lineage graph instead of
      hiding in 23 separate stored procedures.
    columns:
      # THE MIGRATION GUARD FOR delivery_id. `source_provenance()` projects
      # `delivery_ref()`, which coalesces `_delivery_id` with the basename of
      # `_source_file` -- and every raw row has a `_source_file` -- so after
      # that macro landed there is no legitimate NULL here. A NULL means one
      # thing only: this table has not been rebuilt since, so its history
      # cannot say which delivery each row came from, and a run record built
      # from it would enumerate an incomplete input set without saying so.
      #
      # A macro change reaches only the models rebuilt after it. That is the
      # failure `ingest/migrate_raw.py` exists for one layer down; this is the
      # prepared layer's version, and the fix is a `dbt build --full-refresh
      # --select path:models/prepared` on a branch. Failing the build is the
      # point -- an unmigrated prepared table must not publish.
      - name: delivery_id
        tests: [not_null]
      # SCD2: there is no cob_date on this table any more. One row per
      # VERSION, addressed point-in-time with the as_of() macro.
      - name: counterparty_id
        tests: [not_null]
      - name: effective_from
        tests: [not_null]
      - name: effective_to
        tests: [not_null]
      - name: is_current
        tests: [not_null]
      - name: country_code
        tests:
          - dbt_utils.not_empty_string
      - name: is_active
        tests:
          - accepted_values: {values: [true, false], quote: false}
    tests:
      # Replaces [cob_date, counterparty_id]. effective_from is in the key and
      # effective_to is NOT, which is also what lets the incremental merge close an
      # open row in place instead of inserting a second one beside it.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [counterparty_id, effective_from]

      # THE LOAD-BEARING TEST. The incremental path re-derives each touched
      # entity from the version in force when its lookback window starts, so
      # that lead() can close it and a retracted version's predecessor can be
      # reopened (engine.sql, scd2_replay); if
      # that replay window is ever wrong, the result is two versions in force
      # at once, and as_of() then matches both and silently DOUBLES every
      # exposure row for that counterparty. Nothing inside the model can see
      # that state. This is what sees it.
      #
      # effective_to is an INCLUSIVE upper bound (next effective_from minus
      # one day, scd2_effective_to); dbt_utils' own arithmetic assumes an
      # EXCLUSIVE one. Bound here on `date_add(effective_to, 1)`, not
      # `effective_to` itself, with `gaps: not_allowed`: a one-day version
      # passes, and an overlap (same-day included), a zero/negative-length
      # range, or a gap between two of one counterparty's versions all fail.
      #
      # Nothing legitimate produces a gap: `scd2_effective_to` makes a key's
      # versions contiguous by construction, the incremental replay's
      # retraction path REOPENS the preceding version rather than leaving it
      # closed (docs/DECISIONS.md
      # #a-snapshot-re-delivery-restates-the-whole-date), and
      # `apply_scd2_retention` only ever deletes a PREFIX of a key's closed
      # versions (whole range before the oldest retained COB date), never a
      # middle one.
      #
      # The open version's effective_to is DATE '9999-12-31'; `date_add` of
      # that stays a valid Spark DATE -- only COLLECTING such a date into a
      # Python datetime overflows, and this expression is only ever counted.
      #
      # Does NOT catch a missing/duplicate open version
      # (`scd2_exactly_one_current_version`'s job, a singular test under
      # dbt/tests/, not wired here), or anything about the VALUES in a
      # version, only the shape of the ranges. A NULL counterparty_id is
      # not_null's to refuse, not this test's.
      - dbt_utils.mutually_exclusive_ranges:
          lower_bound_column: effective_from
          upper_bound_column: date_add(effective_to, 1)
          partition_by: counterparty_id
          gaps: not_allowed

  - name: fo_trade
    description: Conformed, typed trade positions. No joins, no report opinions.
    columns:
      # See ref_counterparty: a NULL here means this table predates
      # `delivery_ref()` and has not been rebuilt since.
      - name: delivery_id
        tests: [not_null]
      - name: cob_date
        tests: [not_null]
      - name: trade_id
        tests: [not_null]
      - name: counterparty_id
        tests:
          - not_null
          # The load never fails on a bad reference — the TEST fails, and the
          # branch is not merged. This is the write-audit-publish payoff.
          - relationships:
              to: ref('ref_counterparty')
              field: counterparty_id
      - name: notional
        tests:
          - not_null
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}
      - name: currency
        tests:
          - not_null
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cob_date, trade_id]

  - name: ref_rating
    description: Agency ratings with numeric rank and grade band.
    columns:
      # See ref_counterparty: a NULL here means this table predates
      # `delivery_ref()` and has not been rebuilt since.
      - name: delivery_id
        tests: [not_null]
      - name: counterparty_id
        tests: [not_null]
      - name: agency
        tests:
          - not_null
          - accepted_values: {values: ['MOODYS', 'SP', 'FITCH']}
      - name: rating_rank
        # NULL rank means an unmapped rating string — investigate rather than
        # silently excluding the counterparty from investment-grade reporting.
        tests:
          - not_null:
              config: {severity: warn}
      - name: grade_band
        tests:
          - accepted_values: {values: ['INVESTMENT_GRADE', 'SUB_INVESTMENT_GRADE']}
      - name: effective_from
        tests: [not_null]
      - name: effective_to
        tests: [not_null]
      - name: is_current
        tests: [not_null]
    tests:
      # SCD2: the grain is one row per (counterparty, agency) VERSION.
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [counterparty_id, agency, effective_from]
      # See the ref_counterparty block for the full reasoning: bound on the
      # EXCLUSIVE `date_add(effective_to, 1)` with `gaps: not_allowed`, so a
      # one-day version passes and an overlap (same-day included), a
      # zero/negative-length range, or a gap between two of one
      # (counterparty, agency)'s versions all fail. Does not catch a
      # missing/duplicate open version (scd2_exactly_one_current_version's
      # job). A NULL in EITHER column collapses `partition_by`'s
      # concatenation to the same NULL for every such row, regardless of
      # which counterparty or agency it came from -- so unlike a NULL single
      # key, this is not merely not_null's to refuse: were a NULL to reach
      # here, the likely result is a spurious FAIL (unrelated entities'
      # ranges read as one overlapping entity), not a missed defect.
      - dbt_utils.mutually_exclusive_ranges:
          lower_bound_column: effective_from
          upper_bound_column: date_add(effective_to, 1)
          partition_by: counterparty_id || '|' || agency
          gaps: not_allowed
  - name: ref_collateral
    description: Collateral positions held against counterparty exposure, from the collateral management
      system.
    # SCAFFOLDED MINIMUM: not_null on the business key, uniqueness
    # over [cob_date, <business key>], and relationships on any
    # foreign key. Uniqueness proves the in-file dedupe left one row
    # per key. It cannot see a key a re-delivery dropped surviving --
    # uniqueness holds either way; tests/test_dedupe_rank.py pins that.
    # None of it proves the values are right. Add accepted_values /
    # accepted_range for this feed's domain, or it will publish
    # whatever it is given.
    columns:
      # See ref_counterparty: a NULL here means this table predates
      # `delivery_ref()` and has not been rebuilt since.
      - name: delivery_id
        tests: [not_null]
      - name: cob_date
        tests: [not_null]
      - name: collateral_id
        tests: [not_null]
      - name: counterparty_id
        tests:
          - not_null
          - relationships:
              to: ref('ref_counterparty')
              field: counterparty_id
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cob_date, collateral_id]

# Tests for the prepared models. EMPTY UNTIL THE FIRST FEED IS ADDED.
#
# THIS IS THE FILE THAT MAKES WRITE-AUDIT-PUBLISH MEAN ANYTHING. A model with
# no tests builds green forever and publishes whatever it is given; the merge to
# main is gated on `dbt test`, so an untested model has opted out of the gate.
#
# At minimum, per model: not_null on the business key, a
# dbt_utils.unique_combination_of_columns over [business_date, <business key>]
# -- which is what proves dedupe_rank is working -- and a relationships test on
# every foreign key. See docs/ADDING-A-FEED.md step 4.
version: 2

models:
  - name: treasury_margin_call
    columns:
      - name: margin_call_id
        tests: [not_null]
      - name: call_amount
        tests:
          - dbt_utils.accepted_range: {min_value: 0, inclusive: true}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [business_date, margin_call_id]

  - name: treasury_margin_call_scd2
    columns:
      - name: margin_call_id
        tests: [not_null]
    tests:
      - dbt_utils.mutually_exclusive_ranges:
          lower_bound_column: effective_from
          upper_bound_column: effective_to
          partition_by: margin_call_id
          gaps: allowed
          zero_length_range_allowed: true

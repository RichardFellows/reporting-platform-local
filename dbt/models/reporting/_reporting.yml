# Tests and exposures for the reporting models. EMPTY UNTIL THE FIRST MART.
#
# For an aggregate, add a row-count or dbt_utils.equality test back to the model
# it summarises: that is what catches a join which has started dropping rows.
# See docs/ADDING-A-MODEL.md.
#
# `exposures:` belongs here too -- they declare who CONSUMES a mart and build
# nothing. Cosmos excludes them from the DAG deliberately; see
# docs/DECISIONS.md#cosmos-exclude-exposures.
version: 2

models:
  - name: margin_call_exposure
    description: Margin call amounts per counterparty, point-in-time from the SCD2.
    columns:
      - name: margin_call_id
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [business_date, margin_call_id]

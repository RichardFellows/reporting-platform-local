version: 2

models:
  - name: counterparty_exposure
    description: >
      The shared spine of the reporting layer. Every other mart ref()s this
      rather than re-deriving exposure from prepared, so a change to the
      exposure definition moves all reports together. Replaces the legacy report server's
      "Counterparty Exposure Summary" report set.
    columns:
      - name: cob_date
        tests: [not_null]
      - name: counterparty_id
        tests: [not_null]
      - name: legal_name
        description: >
          Null indicates a counterparty present in trades but absent from the
          reference feed. Deliberately surfaced rather than dropped — silently
          losing exposure is the more dangerous failure in a risk report.
        tests:
          - not_null:
              config:
                severity: warn
      - name: total_notional
        tests: [not_null]
      - name: total_mtm
        tests: [not_null]
      - name: reference_carried_forward
        description: >
          True when the counterparty reference feed did not deliver this
          counterparty on this COB date and its attributes were carried
          forward from the last version in force. Under the old daily-snapshot
          model this case surfaced as NULL attributes instead; SCD2 carries
          forward (which is what README and ARCHITECTURE always promised) and
          this column is what keeps the gap visible.
        tests: [not_null]
      - name: rating_as_of
        description: >
          When the most recently-changed agency rating behind this row took
          effect. Rating is a weekly feed, so most COB dates legitimately
          carry forward the last known rating; this says how old it is without
          flagging normal weekly behaviour as a gap.
      - name: reference_effective_from
        description: >
          The date the counterparty attributes in force on this row began.
          Note this is when the VALUE last changed, not when it was last
          delivered — a counterparty delivered daily but unchanged for two
          years has an old effective_from and is not stale. Use
          reference_carried_forward for delivery gaps.
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cob_date, counterparty_id]

  - name: exposure_by_country
    description: >
      Country rollup, derived from counterparty_exposure so it reconciles
      to the detail by construction.
    columns:
      - name: country_code
        tests: [not_null]
      - name: counterparty_count
        tests:
          - dbt_utils.accepted_range: {min_value: 1, inclusive: true}
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cob_date, country_code]
      # Reconciliation is the point of the shared lineage — assert it.
      - dbt_utils.equality:
          compare_model: ref('counterparty_exposure')
          compare_columns: [cob_date]
          config:
            severity: warn

  - name: exposure_change
    description: >
      Day-on-day and month-on-month change in counterparty exposure. This is
      the model the estate's reporting emphasis actually needs, and the one
      that was expensive on the legacy RDBMS.
    columns:
      - name: cob_date
        tests: [not_null]
      - name: counterparty_id
        tests: [not_null]
      - name: change_category
        tests:
          - accepted_values:
              values: ['NEW', 'REMOVED', 'MATERIAL_CHANGE', 'CHANGED', 'UNCHANGED']
      - name: prior_month_end_mtm
        description: >
          Null on the first retained month. Persistent nulls beyond that mean
          the month-end retention rule has been shortened and the month-on-month
          comparison has silently stopped working — which is why this is a test
          and not a comment.
        tests:
          - not_null:
              config:
                severity: warn
    tests:
      - dbt_utils.unique_combination_of_columns:
          combination_of_columns: [cob_date, counterparty_id]

exposures:
  - name: counterparty_exposure_report
    label: Counterparty Exposure (the BI tool)
    type: analysis
    maturity: medium
    description: >
      First Reporting Platform proof point — replaces a set of legacy reports,
      surfaced through the BI tool. Declared here so that `dbt ls
      --select +exposure:counterparty_exposure_report` answers "what breaks if
      I change this model", which is the question the legacy estate cannot
      currently answer.
    depends_on:
      - ref('counterparty_exposure')
      - ref('exposure_change')
    owner:
      # REQ-501's NAMED OWNER, and it is this one rather than a new field.
      # An exposure already names an owner; `context.report_owner()` reads it,
      # and `registry/lifecycle.py` checks a reopening approver against it. Two
      # requirements, one declaration, and no second place for it to be wrong.
      name: Reporting
      email: reporting@example.invalid
    meta:
      # REQ-502. What happens to a published as-at date whose inputs later
      # change. THERE IS NO PLATFORM DEFAULT -- `context.restatement_policy()`
      # refuses a report that has not declared one (open decision 2, settled as
      # `fail`), because the two answers differ only after something has gone
      # wrong and a default would be a policy nobody chose, in force for years.
      #
      # `restate` here: this replaces a set of legacy regulatory-facing
      # reports, so a figure whose inputs have moved must be republished
      # deliberately rather than left standing. A publish onto a locked or
      # submitted date whose deliveries have changed is REFUSED until somebody
      # reopens it. See docs/DECISIONS.md#the-as-at-date-has-a-lifecycle
      restatement: restate

  - name: country_exposure_dashboard
    label: Country Exposure (Qlik)
    type: dashboard
    maturity: low
    description: >
      Retained in the near term. The serving layer must not assume this tool —
      replaceability of the BI product is the constraint that shapes everything
      upstream of it.
    depends_on:
      - ref('exposure_by_country')
    owner:
      name: Reporting
      email: reporting@example.invalid
    meta:
      # `carry_forward`, and the CONTRAST with the report above is the point.
      # This is an internal dashboard: a corrected delivery for a date already
      # published shows up at the current date, and last month's dashboard is
      # not reissued. Two reports over the same lineage with different answers
      # is exactly why the policy is per report and not per platform.
      #
      # REQ-503 lives here too: this is a daily internal report and it
      # traverses the SAME machinery -- same lifecycle table, same gate, same
      # version sequence -- with no separate code path. tests/test_lifecycle.py
      # asserts that rather than trusting this comment.
      restatement: carry_forward

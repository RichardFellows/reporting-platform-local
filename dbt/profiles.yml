# Committed deliberately: every value comes from env_var(), so there is nothing
# secret here and no per-developer copy to drift.
#
# EVERY TARGET IS SPARK, and that is a constraint rather than a preference -- a
# build must land on a Nessie branch, and only the Spark path can address one.
# See docs/DECISIONS.md#duckdb-is-not-an-engine

reporting_platform:
  target: "{{ env_var('DBT_TARGET', 'spark_local') }}"
  outputs:

    spark_local:
      type: spark
      # method: session builds an in-process SparkSession, and
      # server_side_parameters below become .config() calls on its builder.
      # See docs/DECISIONS.md#dbt-spark-session-mode
      method: session
      schema: "{{ env_var('REPORTING_CATALOG', 'lakehouse') }}"
      # INERT. dbt-spark's credential validation demands `host` for every
      # method, but in session mode nothing connects to it -- the cluster is
      # addressed by spark.master below.
      host: spark-master
      threads: 4
      server_side_parameters:
        # What puts the build on the cluster. Must not diverge from SPARK_MASTER
        # in docker-compose.yml. See docs/DECISIONS.md#spark-master-single-source
        spark.master: "{{ env_var('SPARK_MASTER', 'spark://spark-master:7077') }}"
        # Versions from the environment; must equal the jars baked into the
        # Spark image. See docs/DECISIONS.md#jar-versions
        spark.jars.packages: "org.apache.iceberg:iceberg-spark-runtime-3.5_2.12:{{ env_var('ICEBERG_VERSION', '1.6.1') }},org.apache.iceberg:iceberg-aws-bundle:{{ env_var('ICEBERG_VERSION', '1.6.1') }},org.projectnessie.nessie-integrations:nessie-spark-extensions-3.5_2.12:{{ env_var('NESSIE_SPARK_EXT_VERSION', '0.99.0') }},org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262"
        spark.sql.extensions: "org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions,org.projectnessie.spark.extensions.NessieSparkSessionExtensions"
        spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog
        spark.sql.catalog.lakehouse.catalog-impl: org.apache.iceberg.nessie.NessieCatalog
        spark.sql.catalog.lakehouse.uri: "{{ env_var('NESSIE_URI') }}"
        # THE THREAD THAT MAKES THIS A BRANCH BUILD -- the Airflow task injects
        # nessie_ref, and without it dbt writes to main.
        spark.sql.catalog.lakehouse.ref: "{{ var('nessie_ref', 'main') }}"
        spark.sql.catalog.lakehouse.authentication.type: NONE
        spark.sql.catalog.lakehouse.warehouse: "{{ env_var('REPORTING_WAREHOUSE') }}"
        spark.sql.catalog.lakehouse.io-impl: org.apache.iceberg.aws.s3.S3FileIO
        spark.sql.catalog.lakehouse.s3.endpoint: "{{ env_var('S3_ENDPOINT') }}"
        spark.sql.catalog.lakehouse.s3.path-style-access: "true"
        spark.hadoop.fs.s3a.endpoint: "{{ env_var('S3_ENDPOINT') }}"
        spark.hadoop.fs.s3a.path.style.access: "true"
        spark.hadoop.fs.s3a.connection.ssl.enabled: "false"
        spark.sql.session.timeZone: UTC
        spark.sql.defaultCatalog: "{{ env_var('REPORTING_CATALOG', 'lakehouse') }}"
        # Driver-only heap: dbt runs no task work in this process.
        spark.driver.memory: 2g
        # Same cluster-share cap as spark_session() in common/context.py.
        # See docs/DECISIONS.md#spark-worker-sizing
        spark.cores.max: "2"
        spark.executor.cores: "2"
        spark.executor.memory: 2g

    # The cluster target: the same in-process SparkSession, in a driver pod that
    # spark-submit created for this build. It carries far less config because
    # that image ships conf/spark-defaults.conf; only the per-run override
    # belongs here. STILL UNPROVEN -- no cluster has ever run it.
    # See docs/DECISIONS.md#dbt-spark-session-mode
    spark_ocp:
      type: spark
      method: session
      # INERT, as above, but dbt-spark demands it for every method.
      host: localhost
      schema: "{{ env_var('REPORTING_CATALOG', 'lakehouse') }}"
      threads: 8
      server_side_parameters:
        spark.sql.catalog.lakehouse.ref: "{{ var('nessie_ref', 'main') }}"

# Committed deliberately: every value comes from env_var(), so there is nothing
# secret here and no per-developer copy to drift.
#
# EVERY TARGET IS SPARK, and that is a constraint rather than a preference -- a
# build must land on a Nessie branch, and only the Spark path can address one.
# See docs/DECISIONS.md#duckdb-is-not-an-engine

reporting_platform:
  target: "{{ env_var('DBT_TARGET', 'spark_local') }}"
  outputs:

    spark_local:
      type: spark
      # method: session builds an in-process SparkSession, and
      # server_side_parameters below become .config() calls on its builder.
      # See docs/DECISIONS.md#dbt-spark-session-mode
      method: session
      schema: "{{ env_var('REPORTING_CATALOG', 'lakehouse') }}"
      # INERT. dbt-spark's credential validation demands `host` for every
      # method, but in session mode nothing connects to it -- the cluster is
      # addressed by spark.master below.
      host: spark-master
      threads: 4
      # ANCHORED: spark_ocp merges every one of these and overrides only what
      # differs on Kubernetes, so the two targets cannot drift apart.
      server_side_parameters: &spark_params
        # What puts the build on the cluster. Must not diverge from SPARK_MASTER
        # in docker-compose.yml. See docs/DECISIONS.md#spark-master-single-source
        spark.master: "{{ env_var('SPARK_MASTER', 'spark://spark-master:7077') }}"
        # The driver's jars, baked into the Airflow image; the same variable
        # spark_session() reads, so the two drivers cannot diverge. Set as
        # spark.jars, which also ships them to the executors.
        # See docs/DECISIONS.md#driver-jars-are-baked
        spark.jars: "{{ env_var('PLATFORM_DRIVER_JARS') }}"
        # Nessie first, Iceberg last -- see conf/spark-defaults.conf.
        spark.sql.extensions: "org.projectnessie.spark.extensions.NessieSparkSessionExtensions,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions"
        spark.sql.catalog.lakehouse: org.apache.iceberg.spark.SparkCatalog
        spark.sql.catalog.lakehouse.catalog-impl: org.apache.iceberg.nessie.NessieCatalog
        spark.sql.catalog.lakehouse.uri: "{{ env_var('NESSIE_URI') }}"
        # THE THREAD THAT MAKES THIS A BRANCH BUILD -- the Airflow task injects
        # nessie_ref, and without it dbt writes to main.
        spark.sql.catalog.lakehouse.ref: "{{ var('nessie_ref', 'main') }}"
        # NONE by default in every environment -- the shared Nessie has no auth
        # today. The token's DBT_ENV_SECRET_ prefix keeps it out of dbt's logs;
        # an empty token is ignored under NONE. Same settings spark_session()
        # reads. See docs/DECISIONS.md#nessie-auth-is-a-setting
        spark.sql.catalog.lakehouse.authentication.type: "{{ env_var('NESSIE_AUTH_TYPE', 'NONE') | upper }}"
        spark.sql.catalog.lakehouse.authentication.token: "{{ env_var('DBT_ENV_SECRET_NESSIE_AUTH_TOKEN', '') }}"
        spark.sql.catalog.lakehouse.warehouse: "{{ env_var('REPORTING_WAREHOUSE') }}"
        spark.sql.catalog.lakehouse.io-impl: org.apache.iceberg.aws.s3.S3FileIO
        spark.sql.catalog.lakehouse.s3.endpoint: "{{ env_var('S3_ENDPOINT') }}"
        spark.sql.catalog.lakehouse.s3.path-style-access: "true"
        spark.hadoop.fs.s3a.endpoint: "{{ env_var('S3_ENDPOINT') }}"
        spark.hadoop.fs.s3a.path.style.access: "true"
        # Derived from S3_ENDPOINT's own scheme, mirroring spark_session() in
        # common/spark.py -- must not diverge. See
        # docs/DECISIONS.md#s3-ssl-follows-the-endpoint-scheme
        spark.hadoop.fs.s3a.connection.ssl.enabled: "{{ 'true' if env_var('S3_ENDPOINT').startswith('https://') else 'false' }}"
        spark.sql.session.timeZone: UTC
        spark.sql.defaultCatalog: "{{ env_var('REPORTING_CATALOG', 'lakehouse') }}"
        # Driver-only heap: dbt runs no task work in this process.
        spark.driver.memory: 2g
        # Same cluster-share cap as spark_session() in common/context.py.
        # See docs/DECISIONS.md#spark-worker-sizing
        spark.cores.max: "2"
        spark.executor.cores: "2"
        spark.executor.memory: 2g

    # The cluster target: the same in-process SparkSession, as the child
    # process of a Cosmos task in the Airflow task's own pod -- Cosmos stays
    # LOCAL + SUBPROCESS on Kubernetes too, because its artifact archive and
    # the publish gate read dbt's target/ from that pod's filesystem. So this
    # is spark_local exactly, merged below, with a k8s:// master and the keys
    # that put the EXECUTORS in pods. Nothing here comes from
    # conf/spark-defaults.conf: this driver runs in the platform image, which
    # does not have it. STILL UNPROVEN -- no cluster has ever run it.
    # See docs/DECISIONS.md#execution-mode-is-configuration,
    # docs/DECISIONS.md#dbt-spark-session-mode
    spark_ocp:
      type: spark
      method: session
      # INERT, as above, but dbt-spark demands it for every method.
      host: localhost
      schema: "{{ env_var('REPORTING_CATALOG', 'lakehouse') }}"
      threads: 8
      server_side_parameters:
        <<: *spark_params
        # NO DEFAULT: the k8s:// API server, e.g.
        # k8s://https://kubernetes.default.svc:443. spark_session() refuses a
        # k8s master whose PLATFORM_EXECUTION is not `kubernetes`, and the
        # reverse.
        spark.master: "{{ env_var('SPARK_MASTER') }}"
        spark.kubernetes.namespace: "{{ env_var('SPARK_K8S_NAMESPACE') }}"
        spark.kubernetes.container.image: "{{ env_var('SPARK_EXECUTOR_IMAGE') }}"
        spark.kubernetes.authenticate.driver.serviceAccountName: "{{ env_var('SPARK_SERVICE_ACCOUNT') }}"
        spark.executor.instances: "{{ env_var('SPARK_APP_EXECUTORS', '1') }}"
        # Client mode: executors call back to THIS pod, by the IP the chart
        # sets from the downward API.
        spark.driver.host: "{{ env_var('POD_IP') }}"
        spark.driver.bindAddress: 0.0.0.0

name: reporting_platform
version: '1.0.0'
config-version: 2
profile: reporting_platform

model-paths: ["models"]
macro-paths: ["macros"]
test-paths:  ["tests"]
clean-targets: ["target", "dbt_packages"]

# No `target-path:` here -- dbt 1.8 deprecates it in favour of DBT_TARGET_PATH,
# which docker-compose.yml sets to a path outside the ./dbt bind mount.
# Packages go the same way, and are ABSOLUTE on purpose.
# See docs/DECISIONS.md#dbt-working-directories and #dbt-packages-volume
packages-install-path: "{{ env_var('DBT_PACKAGES_INSTALL_PATH', '/opt/platform/run/packages/dbt_packages') }}"

flags:
  # Stops dbt writing .user.yml into the profiles directory, which is the bind
  # mount. See docs/DECISIONS.md#dbt-working-directories
  send_anonymous_usage_stats: false

vars:
  # Nessie branch the build runs on. Injected by the Airflow task; defaults to
  # main for interactive local work.
  nessie_ref: main
  # COB date being built. Empty means "whatever is latest in raw".
  cob_date: ''
  # Trailing COB dates the incremental models reprocess, covering
  # late-arriving corrections without a full rebuild.
  lookback_days: 3

models:
  reporting_platform:
    +file_format: iceberg
    +materialized: incremental
    +incremental_strategy: merge

    # A COLUMN ADDED TO A MODEL REACHES THE TABLE IT MERGES INTO. dbt's
    # default here is `ignore`, and on an incremental model that means a new
    # column exists in the SELECT and never in the target: the build stays
    # green, the column is silently absent, and the only fix is a
    # --full-refresh somebody has to know to run. Adding a column to a feed
    # that already delivers is the commonest change a live feed ever has
    # (docs/ADDING-A-COLUMN.md), so the default was wrong for the change this
    # project makes most.
    #
    # `append_new_columns`, NOT `sync_all_columns`, and the asymmetry is the
    # same one `ingest_feed.plan_raw_schema` draws one layer down: a new
    # column is added and existing rows read NULL -- added, never backfilled,
    # which is the honest answer for data that never had a value -- while a
    # column REMOVED from the model is left in place rather than dropped.
    # `sync_all_columns` would drop it, and renaming a column is
    # indistinguishable from removing one and adding another, so it would
    # delete the history of a column that was only renamed. Dropping one stays
    # a deliberate act.
    #
    # IT ADDS THE COLUMN; IT DOES NOT POPULATE THE ROWS THE RUN DOES NOT
    # TOUCH, and that surprises people, so it is measured here rather than
    # described. Adding a column to `prepared.ref_rating` and running it
    # INCREMENTALLY on a Nessie branch: the column appeared, the 9 SCD2
    # versions the merge actually wrote carried its value, and the other 1412
    # rows stayed NULL. On an SCD2 dimension that means every CURRENT row
    # reads NULL until its entity next changes; on a COB-date model it
    # means the lookback window and no further back. If history has to carry
    # the value, that is what --full-refresh is for -- the difference is that
    # it is now a choice about DATA rather than the only way to get the COLUMN.
    # See docs/DECISIONS.md#a-declared-column-migrates-itself
    +on_schema_change: append_new_columns

    prepared:
      +schema: prepared
      # cob_date leads the partition spec on every table. This is a
      # RETENTION requirement, not a performance one -- see docs/RETENTION.md.
      +partition_by: ['cob_date']
      +tags: ['prepared']

    reporting:
      +schema: reporting
      +partition_by: ['cob_date']
      +tags: ['reporting']

# No `seeds:` block, and no `raw:` one under `models:` -- there are no seed
# files or raw models in this project, and a block that configures nothing makes
# dbt warn on every invocation.
# See docs/DECISIONS.md#no-unused-config-paths

# Fail the build if a source has not been refreshed. Freshness is how a late
# feed becomes visible rather than silently carried forward.
sources:
  reporting_platform:
    +loaded_at_field: _ingest_ts

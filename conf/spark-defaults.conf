# The keys that are the SAME IN EVERY ENVIRONMENT, and nothing else.
#
# No host, bucket, TLS switch or credential source may appear here: the
# cluster's Spark image ships this file (compose only bind-mounts it), and a
# local value baked into an image is one the cluster inherits silently.
# Endpoints, the warehouse, TLS and auth come from the environment --
# spark_session() in common/spark.py, and both targets in dbt/profiles.yml.
# tests/test_spark_config.py fails on a local host name or a literal
# ssl.enabled in any of the three.
# See docs/DECISIONS.md#spark-defaults-hold-only-invariants

# ORDER MATTERS: Nessie first, Iceberg last, or rewrite_data_files fails with
# "Cannot parse order: parser is not an Iceberg ExtendedParser". Must equal
# spark_session() and spark_local in dbt/profiles.yml; the test pins it.
spark.sql.extensions   org.projectnessie.spark.extensions.NessieSparkSessionExtensions,org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions

spark.sql.catalog.lakehouse                 org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lakehouse.catalog-impl    org.apache.iceberg.nessie.NessieCatalog
spark.sql.catalog.lakehouse.io-impl         org.apache.iceberg.aws.s3.S3FileIO

spark.sql.defaultCatalog               lakehouse

# S3A for the landing layer (plain object reads, no Iceberg). The credentials
# provider is left to Hadoop's default chain, which reads AWS_* from the
# environment -- the SimpleAWSCredentialsProvider this file used to pin reads
# fs.s3a.access.key, which nothing sets.
spark.hadoop.fs.s3a.impl               org.apache.hadoop.fs.s3a.S3AFileSystem

spark.sql.session.timeZone             UTC
spark.sql.adaptive.enabled             true
spark.serializer                       org.apache.spark.serializer.KryoSerializer

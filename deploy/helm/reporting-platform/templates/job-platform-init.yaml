{{- /*
The three platform-specific steps of `airflow-init` that the official chart's
own `migrateDatabaseJob`/`createUserJob` hooks do not cover -- see
docs/DECISIONS.md#airflow-init-load-bearing-steps. `db migrate` and `users
create` are the subchart's job; `dbt deps` is not needed here at all, because
the RELEASE image bakes dbt's packages in at build time
(docs/DECISIONS.md#the-release-image-carries-the-code) -- a cluster clone
does not need to be made self-sufficient the way a bind-mounted dev image
does.

A post-install/post-upgrade hook, so it runs once every resource is ready.
The subchart's migrate job is a PLAIN Job, not a hook (values.yaml says why),
and the Airflow pods are not ready until it has finished, so the metadata
schema `pools set` needs always exists by the time this runs.

The raw tables are created with an EMBEDDED Spark in this pod
(PLATFORM_EXECUTION=embedded, local[1], for that one command only), not a
driver pod: this Job's service account needs no rights to create pods, and a
post-upgrade hook must not queue behind executors. A feed declared in this
release then has an empty raw table before its first delivery, so its prepared
model builds instead of failing every prepared build -- see
docs/DECISIONS.md#a-declared-feed-has-a-raw-table-before-it-delivers.
*/ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-platform-init
  labels:
    {{- include "reporting-platform.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "2"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 1
  template:
    metadata:
      labels:
        {{- include "reporting-platform.labels" . | nindent 8 }}
    spec:
      restartPolicy: Never
      containers:
        - name: platform-init
          image: {{ include "reporting-platform.image" (dict
              "repo" .Values.images.platform.repository
              "digest" .Values.images.platform.digest
              "tag" .Values.images.platform.tag
              "name" "images.platform"
              "environment" .Values.environment
              "controlled" (include "reporting-platform.controlled" .)) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["bash", "-euc"]
          args:
            - >
              airflow pools set lakehouse_write "$LAKEHOUSE_WRITE_SLOTS"
              'serialise all Iceberg writers, incl. maintenance' &&
              python -m reporting_platform.registry schema &&
              PLATFORM_EXECUTION=embedded SPARK_MASTER='local[1]'
              python -m reporting_platform.ingest.migrate_raw
          envFrom:
            - configMapRef:
                name: {{ include "reporting-platform.envConfigMap" . }}
            - secretRef:
                name: {{ include "reporting-platform.envSecret" . }}
          env:
            # `airflow pools set` needs the metadata database -- the same
            # Secret the subchart's own jobs and pods read (data.metadataSecretName).
            - name: AIRFLOW__DATABASE__SQL_ALCHEMY_CONN
              valueFrom:
                secretKeyRef:
                  name: {{ required "airflow.data.metadataSecretName is required" .Values.airflow.data.metadataSecretName }}
                  key: connection

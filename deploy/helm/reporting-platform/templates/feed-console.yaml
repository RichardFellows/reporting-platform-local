{{- /*
The feed console (reporting_platform/ui, docker-compose.yml's `feed-ui`).
NEVER above dev -- see `reporting-platform.refuseFeedConsole` in
_helpers.tpl and docs/OPENSHIFT-MAPPING.md, "The feed console is not
deployed above dev".

IT WRITES INTO THE DBT PROJECT (feeds.yml, _sources.yml, a scaffolded model)
ON DISK, and on this image that project is BAKED IN
(docs/DECISIONS.md#the-release-image-carries-the-code), not a volume -- so
those writes are POD-LOCAL and GONE on the next restart or rollout. That is
exactly why this is dev-only: it is a scratch surface for exploring a feed
before it becomes a real commit through git and the pipeline, never a second
source of truth (values.yaml's own comment on `feedConsole`), and a
Kubernetes Deployment restarting it whenever it feels like is the sharpest
possible reminder of that.
*/ -}}
{{- if .Values.feedConsole.enabled }}
{{- include "reporting-platform.refuseFeedConsole" . -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-feed-console
  labels:
    {{- include "reporting-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: feed-console
spec:
  replicas: 1
  strategy:
    # Single worker already (reporting_platform/ui/__main__.py's own
    # docstring: two processes racing feeds.yml's read-modify-write would
    # interleave a lost edit) -- Recreate so two Deployment revisions never
    # do the same thing to the same baked-in file at once.
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}-feed-console
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}-feed-console
        {{- include "reporting-platform.labels" . | nindent 8 }}
        app.kubernetes.io/component: feed-console
    spec:
      containers:
        - name: feed-console
          image: {{ include "reporting-platform.image" (dict
              "repo" .Values.images.platform.repository
              "digest" .Values.images.platform.digest
              "tag" .Values.images.platform.tag
              "name" "images.platform"
              "environment" .Values.environment
              "controlled" (include "reporting-platform.controlled" .)) | quote }}
          imagePullPolicy: {{ .Values.images.pullPolicy }}
          command: ["python", "-m", "reporting_platform.ui"]
          envFrom:
            - configMapRef:
                name: {{ include "reporting-platform.envConfigMap" . }}
            - secretRef:
                name: {{ include "reporting-platform.envSecret" . }}
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: REPORTING_INBOX
              value: /opt/platform/inbox
          ports:
            - name: http
              containerPort: 8082
          # GET /healthz -- 200 once the app is serving, cheap: no Airflow or
          # S3 call (Part B). /api/airflow/health is the expensive one and is
          # deliberately not what a probe hits.
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            initialDelaySeconds: 5
            periodSeconds: 10
{{- if .Values.inbox.enabled }}
          volumeMounts:
            # Read-only, as docker-compose.yml's feed-ui: the console lists
            # and sniffs `.rejected/`, it never moves anything -- inbox.yaml's
            # own Deployment owns the read-write mount.
            - name: inbox
              mountPath: /opt/platform/inbox
              readOnly: true
      volumes:
        - name: inbox
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-inbox
{{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-feed-console
  labels:
    {{- include "reporting-platform.labels" . | nindent 4 }}
    app.kubernetes.io/component: feed-console
spec:
  selector:
    app.kubernetes.io/name: {{ .Release.Name }}-feed-console
  ports:
    - name: http
      port: 8082
      targetPort: http
{{- end }}

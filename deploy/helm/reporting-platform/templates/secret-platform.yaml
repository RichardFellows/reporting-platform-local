{{- /*
The ONE Secret this chart creates -- only when `secrets.create` is true
(dev-throwaway and values-local-k8s.yaml). Above that, `secrets.existingSecret`
names a Secret created outside the chart (Vault, sealed-secrets, the platform
team's own process) and this template renders nothing: see
templates/_helpers.tpl's `reporting-platform.envSecret` for how every pod
still finds the right name either way.
*/ -}}
{{- if and .Values.secrets.create .Values.secrets.existingSecret -}}
{{ fail "secrets.create and secrets.existingSecret are mutually exclusive: set one or the other, not both, or the chart creates a Secret nothing reads." }}
{{- end -}}
{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Release.Name }}-platform-secrets
  labels:
    {{- include "reporting-platform.labels" . | nindent 4 }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ required "secrets.values.awsAccessKeyId is required when secrets.create is true" .Values.secrets.values.awsAccessKeyId | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "secrets.values.awsSecretAccessKey is required when secrets.create is true" .Values.secrets.values.awsSecretAccessKey | quote }}
  # The `platform` registry database. No default, in this chart as in
  # settings.registry_dsn() -- a container started with none reports a
  # healthy, empty registry, which is worse than refusing.
  REGISTRY_DSN: {{ required "secrets.values.registryDsn is required when secrets.create is true" .Values.secrets.values.registryDsn | quote }}
  {{- if .Values.secrets.values.nessieToken }}
  # settings.NESSIE_TOKEN_VAR -- dbt scrubs the `DBT_ENV_SECRET_` prefix from
  # its logs and allows it only in profiles.yml, and the Python Nessie client
  # reads the SAME name, so this is the one name for both sides.
  # See docs/DECISIONS.md#nessie-auth-is-a-setting
  DBT_ENV_SECRET_NESSIE_AUTH_TOKEN: {{ .Values.secrets.values.nessieToken | quote }}
  {{- else if eq .Values.nessie.authType "BEARER" }}
  {{ fail "nessie.authType is BEARER and secrets.create is true, but secrets.values.nessieToken is empty -- every Nessie client (spark_session, both dbt targets, the Python REST client) refuses at read time. Set secrets.values.nessieToken." }}
  {{- end }}
{{- end }}

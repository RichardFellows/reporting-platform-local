# prod: CONTROLLED, as uat.
environment: prod
secrets:
  existingSecret: reporting-platform-prod
airflow:
  data:
    metadataSecretName: reporting-platform-prod-airflow-db
  # Must name the same secret as `secrets.existingSecret` above -- see
  # values-dev.yaml's comment on this same key.
  extraEnvFrom: |
    - configMapRef:
        name: '{{ .Release.Name }}-platform-env'
    - secretRef:
        name: 'reporting-platform-prod'

# uat: CONTROLLED. The project digest must match what was deployed
# (check_project_drift refuses otherwise) and the feed console is refused.
environment: uat
secrets:
  existingSecret: reporting-platform-uat
airflow:
  data:
    metadataSecretName: reporting-platform-uat-airflow-db
  # Must name the same secret as `secrets.existingSecret` above -- see
  # values-dev.yaml's comment on this same key.
  extraEnvFrom: |
    - configMapRef:
        name: '{{ .Release.Name }}-platform-env'
    - secretRef:
        name: 'reporting-platform-uat'

# Feed registry.
#
# This file is the single source of truth for what the platform ingests.
# Adding a feed = adding a block here + a dbt source entry + prepared model.
# No DAG file is edited: airflow/dags/feed_ingest.py generates one DAG per feed.
#
# Filename pattern must yield a `business_date` named group. Everything else
# in the pattern is ignored for routing but retained in `_source_file`.

defaults:
  landing_prefix: landing
  raw_namespace: raw
  arrival_poke_seconds: 60
  arrival_timeout_hours: 26      # deliberately > 24h: a feed is late, not lost
  file_encoding: utf-8
  delimiter: ","
  quote_char: '"'
  header: true
  # 'warn' lands the file and records the drift on the row; 'fail' aborts the
  # load, leaves the ingest branch for inspection and never touches main.
  # Default is 'warn': we prefer to land and let dbt tests fail, because a
  # rejected file is a file nobody looks at.
  #
  # 'fail' fires on an EXTRA column and on a MISSING declared one. The extra
  # case is the obvious one; the missing case is the quieter and arguably
  # worse one, because reconcile_schema fills it with nulls, so the load
  # succeeds and the column reads as "no value" rather than "never arrived".
  #
  # Both branches have been exercised (
  # until then nothing read this setting at all and 'fail' was silently
  # identical to 'warn').
  schema_drift: warn

# EMPTY. Add a feed here and the platform grows an ingest DAG, a raw table, an
# asset that triggers the builds, and retention/maintenance coverage -- with no
# DAG file edited. docs/ADDING-A-FEED.md has the five files in order, and the
# feed console on :8082 writes them from a form.
#
# Name a feed <source_system>_<feed> -- fo_trade, treasury_margin_call. That one
# string is the raw table, the DAG id, the landing prefix, the dbt source table
# and the prepared model at once.
# See docs/DECISIONS.md#feed-names-carry-the-source and
# docs/DECISIONS.md#the-empty-project
feeds:

  - name: treasury_margin_call
    description: Margin calls per counterparty and call type, from TREASURY.
    source_system: TREASURY
    filename_pattern: 'marginCalls_(?P<business_date>\d{8})(?:_v(?P<version>\d+))?\.txt'
    delimiter: '|'
    business_key: [margin_call_id]
    expected_min_rows: 10
    columns:
      - margin_call_id: Margin Call Id
      - counterparty_id: Cpty Ref
      - call_amount: Call Amount (USD)
      - currency
      - call_date: Call Date
    column_types:
      call_amount: decimal
      call_date: date
    control:
      filename_pattern: 'marginCalls_(?P<business_date>\d{8})\.ctl'
      filename_template: 'marginCalls_{business_date}.ctl'
      delimiter: '|'
      keys:
        business_date: ReportingDate
        rows: Rows
        md5: MD5

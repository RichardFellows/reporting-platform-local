# Feed registry.
#
# This file is the single source of truth for what the platform ingests.
# Adding a feed = adding a block here + a dbt source entry + prepared model.
# No DAG file is edited: airflow/dags/feed_ingest.py generates one DAG per feed.
#
# Filename pattern must yield a `business_date` named group. Everything else
# in the pattern is ignored for routing but retained in `_source_file`.

defaults:
  landing_prefix: landing
  # Derived from landing/ and rebuildable from it -- a cache, not a
  # third copy. Kept OUT of landing/ so the evidence sweep never sees
  # it. See docs/DELIVERY-SHAPES.md.
  ready_prefix: ready
  raw_namespace: raw
  file_encoding: utf-8
  delimiter: ","
  quote_char: '"'
  header: true
  # 'warn' lands the file and records the drift on the row; 'fail' aborts the
  # load, leaves the ingest branch for inspection and never touches main.
  # Default is 'warn': we prefer to land and let dbt tests fail, because a
  # rejected file is a file nobody looks at.
  #
  # 'fail' fires on an EXTRA column and on a MISSING declared one. The extra
  # case is the obvious one; the missing case is the quieter and arguably
  # worse one, because reconcile_schema fills it with nulls, so the load
  # succeeds and the column reads as "no value" rather than "never arrived".
  #
  # Both branches have been exercised (
  # until then nothing read this setting at all and 'fail' was silently
  # identical to 'warn').
  schema_drift: warn
  # REQ-600/601. Which EVIDENCE OBLIGATION a feed's landing and quarantine
  # objects are under. Declared in retention.yml, which is also where the
  # windows live -- the name is a property of the feed and the years are a
  # per-environment policy, so they are deliberately in different files.
  # `standard` is the reproducibility window: what a published report is
  # reproduced from. See docs/DECISIONS.md#retention-classes-name-the-obligation
  retention_class: standard

# A middle tier between `defaults:` above and a feed block below:
# defaults -> convention -> feed, each layer overriding the last.
#
# The variation between feeds is mostly PER SOURCE SYSTEM, not per feed. One
# system sends pipe-delimited files, another sends zips with a control file,
# and that knowledge previously had nowhere to live -- so it was retyped into
# every feed block and drifted between them. Onboard the source system once,
# and its second and fortieth feeds are a name, a key and a column list.
#
# A convention may set anything a feed block may except `name` and
# `convention` itself, and conventions DO NOT CHAIN. Naming one that does not
# exist is an error at load, not a silent fall back to `defaults:`, and so is
# a misspelled key inside one. See docs/DECISIONS.md#feed-conventions
conventions:

  ref_src:
    # The three reference feeds are one delivery arrangement, not three.
    source_system: REF_SRC
    expected_min_rows: 10
    # REQ-201. The wall-clock time by which the upstream has agreed a delivery
    # will have ARRIVED. One arrangement, one time -- which is the case for
    # putting it on the convention rather than repeating it on three feeds
    # that would then drift apart.
    #
    # QUOTED, and it has to be. Unquoted, YAML 1.1 reads a time as SEXAGESIMAL
    # -- `7:30` is the integer 450. A LEADING ZERO happens to block pyyaml's
    # resolver, so `07:30` would survive unquoted and `9:30` would not, which
    # is worse than if it never worked: it would hold until the first hour
    # somebody did not pad. `parse_expected_by` refuses a non-string saying so.
    expected_by: "07:30"

feeds:

  - name: fo_trade
    description: Daily position-level trade extract from the front office.
    source_system: FO_SRC
    filename_pattern: 'TRADE_(?P<business_date>\d{8})(?:_v(?P<version>\d+))?\.csv'
    business_key: [trade_id]
    expected_min_rows: 100
    # The front office closes and extracts before the reference systems do.
    expected_by: "06:30"
    columns:
      - trade_id
      - counterparty_id
      - book
      - product_type
      - notional
      - currency
      - trade_date
      - maturity_date
      - mtm_value

  - name: ref_counterparty
    convention: ref_src
    description: Counterparty reference data. Slowly changing.
    filename_pattern: 'CPTY_(?P<business_date>\d{8})(?:_v(?P<version>\d+))?\.csv'
    business_key: [counterparty_id]
    columns:
      - counterparty_id
      - legal_name
      - country_code
      - sector
      - parent_counterparty_id
      - is_active

  - name: ref_rating
    convention: ref_src
    description: External agency credit ratings.
    filename_pattern: 'RATING_(?P<business_date>\d{8})(?:_v(?P<version>\d+))?\.csv'
    business_key: [counterparty_id, agency]
    # Agency ratings arrive weekly, not daily. Without this the gap
    # check infers the business calendar from the daily feeds and
    # reports every non-delivery day as a gap -- it did exactly that on its
    # first run, five false gaps in a ten-day window. `weekly` asks only that
    # each week containing business dates saw at least one delivery.
    cadence: weekly
    columns:
      - counterparty_id
      - agency
      - rating
      - rating_date
      - outlook
  - name: ref_collateral
    convention: ref_src
    description: Collateral positions held against counterparty exposure, from the collateral management
      system.
    filename_pattern: 'COLLATERAL_(?P<business_date>\d{8})(?:_v(?P<version>\d+))?\.csv'
    business_key: [collateral_id]
    # BEHIND NO PUBLISHED REPORT. `feeds_behind_report` walks the exposures'
    # ref() closure and this feed is in neither report's lineage, so no
    # published figure is reproduced from its evidence and the published-tag
    # interlock does not bind it. `operational` is 7 years rather than 10 --
    # still above the raw layer's own window, which find_pending needs.
    #
    # THIS IS A POLICY STATEMENT, not a tuning knob: if a report ever ref()s
    # prepared.ref_collateral, check_reproducibility_window() will refuse the
    # nightly sweep until this is moved back to `standard`. That refusal is
    # the mechanism -- the class cannot silently outlive its correctness.
    retention_class: operational
    columns:
      - collateral_id
      - counterparty_id
      - collateral_type
      - market_value
      - currency
      - valuation_date
      - haircut_pct
      - is_eligible
    column_types:
      haircut_pct: decimal

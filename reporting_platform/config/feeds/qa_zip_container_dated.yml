name: qa_zip_container_dated
description: QA dated ZIP archive whose CSV members share the container COB date
source_system: QA
filename_pattern: 'results_(?P<cob_date>\d{8})(?:_v(?P<version>\d+))?\.zip'
delivery:
  kind: archive
  member_pattern: '(?:results|context)\.csv'
delimiter: '|'
business_key: [position_id]
expected_min_rows: 1
delivery_expected: false
columns:
  - position_id
  - amount
  - currency
column_types:
  currency: string

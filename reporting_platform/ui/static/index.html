<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Feed console</title>
<style>
  :root {
    --bg: #11131a; --panel: #181b24; --panel-2: #1f232e; --line: #2b3140;
    --ink: #e6e9f0; --muted: #97a0b5; --accent: #6ea8fe; --ok: #4ec98a;
    --warn: #e6b455; --bad: #e8697d; --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
         font: 14px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; align-items: center; gap: 16px; padding: 12px 20px;
           border-bottom: 1px solid var(--line); background: var(--panel); }
  header h1 { font-size: 15px; margin: 0; font-weight: 600; letter-spacing: .01em; }
  header .links { margin-left: auto; display: flex; gap: 14px; font-size: 12px; }
  a { color: var(--accent); text-decoration: none; }
  a:hover { text-decoration: underline; }
  main { display: grid; grid-template-columns: 290px 1fr; height: calc(100vh - 49px); }
  aside { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
  section.detail { overflow-y: auto; padding: 20px 24px 60px; }
  .feed-item { padding: 10px 14px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .feed-item:hover { background: var(--panel-2); }
  .feed-item.active { background: var(--panel-2); box-shadow: inset 3px 0 0 var(--accent); }
  .feed-item .nm { font-weight: 600; }
  .feed-item .sub { color: var(--muted); font-size: 12px; }
  .newbtn { width: 100%; padding: 11px; background: none; border: 0;
            border-bottom: 1px solid var(--line); color: var(--accent);
            font: inherit; cursor: pointer; text-align: left; padding-left: 14px; }
  .newbtn:hover { background: var(--panel-2); }
  h2 { font-size: 18px; margin: 0 0 2px; }
  h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em;
       color: var(--muted); margin: 26px 0 10px; font-weight: 600; }
  .sub { color: var(--muted); }
  .tabs { display: flex; gap: 4px; margin: 18px 0 0; border-bottom: 1px solid var(--line); }
  .tabs button { background: none; border: 0; border-bottom: 2px solid transparent;
                 color: var(--muted); padding: 8px 14px; font: inherit; cursor: pointer; }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); }
  .pane { display: none; padding-top: 4px; } .pane.active { display: block; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12px;
       padding: 6px 8px; border-bottom: 1px solid var(--line); }
  td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }
  .pill { display: inline-block; padding: 1px 8px; border-radius: 10px; font-size: 11.5px;
          border: 1px solid var(--line); color: var(--muted); }
  .pill.ok { color: var(--ok); border-color: #24543c; }
  .pill.warn { color: var(--warn); border-color: #5b4720; }
  .pill.bad { color: var(--bad); border-color: #5e2733; }
  button.act { background: var(--panel-2); border: 1px solid var(--line); color: var(--ink);
               padding: 7px 13px; border-radius: 5px; font: inherit; cursor: pointer; }
  button.act:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
  button.act:disabled { opacity: .45; cursor: progress; }
  button.act.primary { background: #23407a; border-color: #2f5296; }
  button.act.danger:hover { border-color: var(--bad); color: var(--bad); }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
  input, textarea, select { width: 100%; background: var(--bg); color: var(--ink);
        border: 1px solid var(--line); border-radius: 5px; padding: 7px 9px; font: inherit; }
  input.mono, textarea.mono { font-family: var(--mono); font-size: 12.5px; }
  .field { margin-bottom: 14px; }
  .field .err { color: var(--bad); font-size: 12px; margin-top: 4px; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .note { background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--accent);
          padding: 10px 12px; border-radius: 4px; color: var(--muted); font-size: 12.5px;
          margin: 10px 0; }
  .note.warn { border-left-color: var(--warn); }
  pre.log { background: #0c0e14; border: 1px solid var(--line); border-radius: 5px;
            padding: 10px 12px; font-family: var(--mono); font-size: 12px;
            max-height: 320px; overflow: auto; white-space: pre-wrap; margin: 10px 0; }
  .steps li { margin-bottom: 3px; }
  .colrow { display: grid; grid-template-columns: 1fr 130px 30px; gap: 8px; margin-bottom: 6px; }
  .muted { color: var(--muted); }
  .stage { display: flex; align-items: center; gap: 10px; margin: 12px 0; flex-wrap: wrap; }
  /* Job and run output is bounded and scrolls rather than growing without
     limit. Combined with putting every output BELOW the controls (see
     paneRun), this is what stops a button moving out from under the pointer
     while an async result renders above it. */
  .outbox { max-height: 320px; overflow-y: auto; }
  .stage .arrow { color: var(--muted); }
  .box { border: 1px solid var(--line); border-radius: 6px; padding: 10px 12px;
         background: var(--panel); min-width: 132px; }
  .box .t { font-size: 11.5px; color: var(--muted); text-transform: uppercase;
            letter-spacing: .05em; }
  .box .v { font-size: 13px; margin-top: 2px; }
  .scroll { max-height: 340px; overflow: auto; border: 1px solid var(--line); border-radius: 6px; }
  .empty { color: var(--muted); padding: 14px; }
</style>
</head>
<body>
<header>
  <h1>Feed console</h1>
  <span id="af-health" class="pill">airflow …</span>
  <span class="links">
    <a href="http://localhost:8081" id="link-airflow" target="_blank">Airflow</a>
    <a href="http://localhost:8080" id="link-spark" target="_blank">Spark</a>
    <a href="http://localhost:19001" id="link-minio" target="_blank">MinIO</a>
    <a href="http://localhost:19120/api/v2/trees" id="link-nessie" target="_blank">Nessie refs</a>
    <a href="/api/docs" target="_blank">API</a>
  </span>
</header>

<main>
  <aside>
    <button class="newbtn" id="new-feed">+ New feed</button>
    <button class="newbtn" id="arrivals-btn">Arrivals</button>
    <button class="newbtn" id="unclaimed-btn">Unclaimed deliveries</button>
    <div id="feed-list"></div>
  </aside>
  <section class="detail" id="detail"><div class="empty">Select a feed, or add one.</div></section>
</main>

<script>
const $ = (s, r=document) => r.querySelector(s);
const el = (t, a={}, kids=[]) => {
  const n = document.createElement(t);
  for (const [k, v] of Object.entries(a)) {
    if (k === "class") n.className = v;
    else if (k === "html") n.innerHTML = v;
    else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
    else if (v !== null && v !== undefined) n.setAttribute(k, v);
  }
  for (const kid of [].concat(kids)) n.append(kid);
  return n;
};
async function api(path, opts={}) {
  const res = await fetch(path, opts);
  let body = null;
  try { body = await res.json(); } catch (e) { body = null; }
  if (!res.ok) {
    const err = new Error((body && (body.detail || JSON.stringify(body.errors))) || res.statusText);
    err.status = res.status; err.body = body;
    throw err;
  }
  return body;
}
const jpost = (path, body) => api(path, {
  method: "POST", headers: {"Content-Type": "application/json"},
  body: JSON.stringify(body ?? {})});

let STATE = { feeds: [], conventions: [], retentionClasses: [], selected: null,
              tab: "details", types: [] };

// --------------------------------------------------------------- feed list
async function loadFeeds(keep) {
  const data = await api("/api/feeds");
  STATE.feeds = data.feeds;
  STATE.conventions = data.conventions || [];
  STATE.retentionClasses = data.retention_classes || [];
  const list = $("#feed-list");
  list.textContent = "";
  for (const f of data.feeds) {
    const incomplete = Object.values(f.scaffold).some(v => !v);
    list.append(el("div", {
      class: "feed-item" + (f.name === keep ? " active" : ""),
      onclick: () => selectFeed(f.name),
    }, [
      el("div", {class: "nm"}, f.name),
      el("div", {class: "sub"}, `${f.source_system} · ${f.columns.length} cols` +
        (incomplete ? " · incomplete" : "")),
    ]));
  }
}

async function selectFeed(name, tab) {
  STATE.selected = name;
  STATE.tab = tab || "details";
  await loadFeeds(name);
  renderDetail(STATE.feeds.find(f => f.name === name));
}

// ------------------------------------------------------------ feed detail
function scaffoldPills(s) {
  const labels = {dbt_source: "dbt source", prepared_model: "prepared model",
                  prepared_tests: "tests"};
  // These are PRESENCE checks -- the file exists, the entry is in the YAML.
  // Whether dbt can actually read what is there is a different question, and
  // the caption says so rather than letting four green pills imply it.
  return el("div", {}, [
    el("div", {class: "row"}, Object.entries(labels).map(([k, label]) =>
      el("span", {class: "pill " + (s[k] ? "ok" : "bad")},
         (s[k] ? "✓ " : "✗ ") + label))),
    el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
       "Presence only — these say the files exist, not that dbt accepts them. " +
       "Use Validate dbt project on the Details tab for that."),
  ]);
}

function renderDetail(f) {
  if (!f) return;
  const d = $("#detail");
  d.textContent = "";
  d.append(
    el("h2", {}, f.name),
    el("div", {class: "sub"}, f.description),
    el("div", {class: "row", style: "margin-top:10px"}, [
      el("span", {class: "pill"}, f.raw_table),
      el("span", {class: "pill"}, f.landing_prefix),
      el("span", {id: "dag-pill",
                  class: "pill " + (f.dag_known ? (f.dag_paused ? "warn" : "ok") : "warn")},
         f.dag_known === null ? "DAG state unknown (Airflow unreachable)"
           : f.dag_known ? (f.dag_paused ? "DAG paused" : "DAG live")
           : "DAG not parsed yet"),
      el("span", {class: "pill"}, f.cadence),
    ]),
    el("div", {style: "margin-top:10px", id: "scaffold-pills"},
       [scaffoldPills(f.scaffold)]),
  );

  const tabs = el("div", {class: "tabs"});
  const panes = el("div");
  for (const [key, label, render] of [
    ["details", "Details", paneDetails],
    ["data", "Data", paneData],
    ["arrivals", "Arrivals", paneArrivals],
    ["run", "Run", paneRun],
  ]) {
    const btn = el("button", {class: STATE.tab === key ? "active" : "",
                              onclick: () => { STATE.tab = key; renderDetail(f); }}, label);
    tabs.append(btn);
    const pane = el("div", {class: "pane" + (STATE.tab === key ? " active" : "")});
    panes.append(pane);
    if (STATE.tab === key) render(pane, f);
  }
  d.append(tabs, panes);
}

// --------------------------------------------------------------- details tab
function paneDetails(pane, f) {
  const form = feedForm(f, false);
  pane.append(form.node);
  pane.append(el("div", {class: "row", style: "margin-top:6px"}, [
    el("button", {class: "act primary", onclick: async (e) => {
      await withBusy(e.target, async () => {
        const payload = form.read();
        try {
          await api(`/api/feeds/${f.name}`, {
            method: "PUT", headers: {"Content-Type": "application/json"},
            body: JSON.stringify(payload)});
          form.clearErrors();
          toast(pane, "feeds.yml updated. Airflow picks the change up on its next parse of feed_ingest.py (~30s).");
          selectFeed(f.name, "details");
        } catch (err) { form.showErrors(err); }
      });
    }}, "Save changes"),
    el("button", {class: "act", onclick: async (e) => {
      await withBusy(e.target, async () => {
        const r = await jpost(`/api/scaffold/${f.name}`, {column_types: form.readTypes()});
        renderSteps(pane, r.steps);
        renderValidation(pane, r.validation);
        // Refresh the pills in place rather than re-rendering the whole
        // detail pane, which would discard the result just rendered.
        const pills = $("#scaffold-pills");
        if (pills) { pills.textContent = ""; pills.append(scaffoldPills(r.scaffold)); }
      });
    }}, "Fill missing dbt files"),
    el("button", {class: "act", onclick: async (e) => {
      await withBusy(e.target, async () => {
        renderValidation(pane, await jpost("/api/validate"));
      });
    }}, "Validate dbt project"),
    // The checkbox is a child of the LABEL only. Listing it as a direct child
    // of the row as well moved it out of the label (a node has one parent),
    // which rendered a stray checkbox on one line and its text on another.
    el("label", {style: "display:flex;gap:6px;align-items:center;margin:0",
                 class: "sub"},
       [(DEL_MODEL = el("input", {type: "checkbox"})),
        el("span", {}, `also delete dbt/models/prepared/${f.name}.sql`)]),
    el("button", {class: "act danger", onclick: () => deleteFeed(pane, f)}, "Delete feed"),
  ]));

  pane.append(el("div", {class: "note"},
    "The name is fixed once created: it is the raw table, the DAG id, the S3 prefix, " +
    "the dbt source and the model at the same time. " +
    "To rename, delete and re-add."));
}

let DEL_MODEL = null;

async function deleteFeed(pane, f) {
  // ONE dialog, and the secondary choice is a checkbox on the page rather than
  // a second confirm(). A second confirm() after the type-the-name gate makes
  // Escape commit the delete instead of cancelling it -- the one key a
  // hesitant person reaches for. See docs/DECISIONS.md#one-destructive-dialog
  // The checkbox is visible before you commit, and the prompt states which
  // way it is set so the confirmation describes what will actually happen.
  const alsoModel = !!(DEL_MODEL && DEL_MODEL.checked);
  const typed = prompt(
    `Remove ${f.name} from the registry?

` +
    `${f.raw_table} and anything built from it are LEFT IN PLACE, but stop being ` +
    `maintained or retained.

` +
    (alsoModel ? `dbt/models/prepared/${f.name}.sql WILL be deleted.`
               : `dbt/models/prepared/${f.name}.sql will be kept.`) +
    `

Type the feed name to confirm:`);
  if (typed !== f.name) return;
  const r = await api(`/api/feeds/${f.name}?confirm=${encodeURIComponent(f.name)}` +
                      `&scaffold_too=${alsoModel}`, {method: "DELETE"});
  STATE.selected = null;
  await loadFeeds();
  $("#detail").textContent = "";
  $("#detail").append(el("div", {class: "note warn"},
    `Removed ${r.deleted}. ${r.note} ${r.files_removed.length ? "Deleted: " + r.files_removed.join(", ") : ""}`));
}

// ------------------------------------------------------------- the form
function feedForm(f, creating) {
  const node = el("div");
  const errBoxes = {};
  const field = (key, label, input, help) => {
    const err = el("div", {class: "err"});
    errBoxes[key] = err;
    return el("div", {class: "field"}, [
      el("label", {}, label), input,
      help ? el("div", {class: "sub", style: "font-size:12px;margin-top:4px"}, help) : "",
      err]);
  };

  const name = el("input", {value: f?.name ?? "", placeholder: "margin_call",
                            class: "mono", disabled: creating ? null : "disabled"});
  const desc = el("textarea", {rows: "2", placeholder: "What this feed carries, and from where."});
  desc.value = f?.description ?? "";
  const src = el("input", {value: f?.source_system ?? "", placeholder: "MARGIN_SRC"});
  const pattern = el("input", {class: "mono", value: f?.filename_pattern ?? "",
                               placeholder: "FEED_(?P<cob_date>\\d{8})\\.csv"});
  const example = el("input", {class: "mono", placeholder: "marginCalls_20260801.csv"});
  const patternResult = el("div", {class: "sub", style: "font-size:12px;margin-top:6px"});
  const minRows = el("input", {type: "number", min: "0", value: f?.expected_min_rows ?? 10});
  const cadence = el("select", {}, ["daily", "weekly"].map(v =>
    el("option", {value: v, selected: (f?.cadence ?? "daily") === v ? "selected" : null}, v)));
  const drift = el("select", {}, ["warn", "fail"].map(v =>
    el("option", {value: v, selected: (f?.schema_drift ?? "warn") === v ? "selected" : null}, v)));
  const deliveryExpected = el("input", {type: "checkbox"});
  deliveryExpected.checked = f ? f.delivery_expected : true;
  // Closed list, never free text: a typo'd convention name is not an error the
  // user would see, it is a silent revert to `defaults:` -- the feed loads and
  // reads its files with the wrong delimiter. "(none)" is the empty string.
  const convention = el("select", {}, [
    el("option", {value: "", selected: (f?.convention ?? "") === "" ? "selected" : null},
       "(none)"),
    ...(STATE.conventions || []).map(v =>
      el("option", {value: v, selected: (f?.convention ?? "") === v ? "selected" : null}, v)),
  ]);

  // REQ-201. Text, not <input type="time">: the value written to feeds.yml is
  // a QUOTED "HH:MM" string, and the browser's time widget localises its
  // display, which would show an Asian desk a different number from the one
  // the file holds. The platform's own `parse_expected_by` is what validates
  // it on save, so the pattern here only saves a round trip.
  const expectedBy = el("input", {class: "mono", placeholder: "07:00",
                                  pattern: "([01][0-9]|2[0-3]):[0-5][0-9]"});
  expectedBy.value = f?.expected_by ?? "";
  // Closed list for the same reason `convention` is one, but failing harder:
  // a class retention.yml does not declare is refused when feeds.yml LOADS,
  // so a typo here does not degrade the feed, it stops Airflow parsing.
  const RCLASSES = (STATE.retentionClasses || []).length
    ? STATE.retentionClasses : ["standard"];
  const retentionClass = el("select", {}, RCLASSES.map(v =>
    el("option", {value: v,
                  selected: (f?.retention_class ?? "standard") === v ? "selected" : null},
       v)));

  // ---------------------------------------------------------- file format
  // These four reach Spark's reader unchanged. A wrong delimiter does not
  // fail: it lands ONE column holding the whole row, so it is worth setting
  // before anything is uploaded or generated.
  const DELIMS = [[",", "comma"], ["|", "pipe"], ["\\t", "tab"],
                  [";", "semicolon"], ["", "other\u2026"]];
  const known = DELIMS.some(([v]) => v === (f?.delimiter ?? ","));
  const delim = el("select", {}, DELIMS.map(([v, label]) =>
    el("option", {value: v,
                  selected: (known ? v === (f?.delimiter ?? ",") : v === "")
                            ? "selected" : null},
       v ? label + "  " + (v === "\\t" ? "\\t" : v) : label)));
  const delimOther = el("input", {class: "mono", style: "width:6em",
                                  placeholder: "\\t", maxlength: "2",
                                  value: known ? "" : (f?.delimiter ?? "")});
  const syncDelim = () => { delimOther.disabled = delim.value !== ""; };
  delim.addEventListener("change", syncDelim);
  syncDelim();
  const readDelim = () => (delim.value === "" ? delimOther.value : delim.value);

  const quote = el("input", {class: "mono", style: "width:6em", maxlength: "1",
                             value: f?.quote_char ?? '"'});
  const encoding = el("input", {class: "mono", style: "width:10em",
                                value: f?.file_encoding ?? "utf-8"});
  const hasHeader = el("input", {type: "checkbox"});
  hasHeader.checked = f ? f.header : true;

  async function testPattern() {
    const r = await jpost("/api/test-pattern",
      {pattern: pattern.value, filename: example.value});
    patternResult.textContent = r.ok
      ? `✓ matches — cob_date ${r.cob_date}, version ${r.version}`
      : `✗ ${r.reason}`;
    patternResult.style.color = r.ok ? "var(--ok)" : "var(--bad)";
  }

  node.append(
    field("name", "Name", name,
      "Lowercase with underscores. Becomes lakehouse.raw.<name>, DAG ingest_<name> and landing/<name>/."),
    field("description", "Description", desc),
    field("source_system", "Source system", src, "Becomes the DAG's tag."),
    field("convention", "Convention", convention,
      "Inherit this source system's delivery settings. Anything the "
      + "convention sets is left out of this feed's own block, so it stays "
      + "in one place."),
    el("div", {class: "field"}, [
      el("label", {}, "Example delivered filename"),
      el("div", {class: "row"}, [
        el("div", {style: "flex:1"}, example),
        el("button", {class: "act", onclick: async () => {
          if (!example.value.trim()) return;
          try {
            const r = await jpost("/api/derive-pattern", {example: example.value});
            pattern.value = r.pattern;
            await testPattern();
          } catch (err) { patternResult.textContent = "✗ " + err.message;
                          patternResult.style.color = "var(--bad)"; }
        }}, "Derive pattern"),
        el("button", {class: "act", onclick: testPattern}, "Test"),
      ]),
      patternResult,
    ]),
    field("filename_pattern", "Filename pattern (in landing)", pattern,
      "Matched with re.fullmatch, so it must cover the whole filename, and must contain " +
      "a (?P<cob_date>\\d{8}) group. This is the name the file has IN LANDING. If the " +
      "upstream sends something else — no date, a wrong prefix — leave this as the name you " +
      "want and describe the real one under Arrival below; the inbox renames it on the way in. " +
      "A pattern that matches nothing is silent: the feed simply never has anything pending."),
  );

  // ------------------------------------------------------------- arrival
  // landing/ HAS A CONTRACT: everything in it is correctly named and
  // classified. A legacy upstream that sends `positions.csv` with the date
  // inside `positions.ctl` does not satisfy it, and the fix is to make the
  // delivery conformant AT THE DOOR rather than teach the whole platform a
  // second shape. This section is what the door needs.
  // See docs/DECISIONS.md#the-inbox-is-the-conformance-gate.
  const hasArrival = el("input", {type: "checkbox"});
  hasArrival.checked = !!(f?.arrival && f.arrival.source_pattern);
  const sourcePattern = el("input", {class: "mono",
    value: f?.arrival?.source_pattern ?? "", placeholder: "positions\\.csv"});
  const arrCtlPattern = el("input", {class: "mono",
    value: f?.arrival?.control?.pattern ?? "", placeholder: "{stem}\\.ctl"});
  const arrCtlDate = el("input", {class: "mono",
    value: f?.arrival?.control?.cob_date ?? "",
    placeholder: "ReportingDate\\|(?P<cob_date>\\d{8})"});
  // Retitled by syncControlFormat() below: under a delimited control file
  // this names a COLUMN, and a label still saying "pattern" beside a
  // placeholder showing a regex is worse than no help at all.
  const arrCtlDateLabel = el("label", {}, "COB date pattern");
  const arrCtlDateHelp = el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
    "Read from the control file's contents. For a line like " +
    "ReportingDate|20260801 that is " +
    "'ReportingDate\\|(?P<cob_date>\\d{8})'. Required unless the " +
    "upstream filename above already captures the date.");

  const arrivalFields = el("div", {}, [
    el("div", {class: "field", style: "margin-top:10px"}, [
      el("label", {}, "Filename as the upstream sends it"),
      sourcePattern,
      el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
        "A regex, fullmatched against the name in the inbox — a different " +
        "string from the landing pattern above. It may capture " +
        "(?P<cob_date>\\d{8}) if the sender's name has a date but is " +
        "otherwise wrong; if it does not, the control file below must supply " +
        "the date. Exactly one of the two, never both."),
    ]),
    el("div", {class: "field", style: "margin-top:10px"}, [
      el("label", {}, "Control file pattern"),
      arrCtlPattern,
      el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
        "{stem} stands for the delivery's own filename minus its extension. " +
        "The control file is consumed at the door and never reaches landing; " +
        "its contents are copied verbatim into the metadata file instead. " +
        "Until it arrives the delivery is HELD in the inbox — not rejected, " +
        "and not landed."),
    ]),
    el("div", {class: "field", style: "margin-top:10px"}, [
      arrCtlDateLabel,
      arrCtlDate,
      arrCtlDateHelp,
    ]),
    el("div", {class: "sub", style: "font-size:12px;margin-top:10px"},
      "Row count and checksum are NOT set here \u2014 they belong to the " +
      "control file's landing-side block below, so they are checked once for " +
      "every delivery whether it came through the inbox or an approved sender " +
      "wrote it straight into landing. The inbox establishes identity; " +
      "ingestion verifies content."),
  ]);

  function syncArrivalVisibility() {
    arrivalFields.style.display = hasArrival.checked ? "" : "none";
    if (hasArrival.checked && !arrCtlPattern.value.trim())
      arrCtlPattern.value = "{stem}\\.ctl";
  }
  hasArrival.addEventListener("change", syncArrivalVisibility);
  syncArrivalVisibility();

  node.append(
    el("div", {class: "field"}, [
      el("label", {}, "Arrival"),
      el("div", {class: "row"}, [hasArrival,
        el("span", {class: "sub", style: "font-size:12px"},
           "This feed arrives via the inbox and needs renaming or checking " +
           "before it can land. Leave unchecked when the upstream already " +
           "writes a correctly named file straight into landing/ — which is " +
           "every feed here today.")]),
      (errBoxes["arrival"] = el("div", {class: "err"})),
    ]),
    arrivalFields,
  );

  // ------------------------------------------------------- delivery shape
  // Absent, or kind: file, is a plain object per delivery -- the ordinary
  // case and every feed before this section existed. See
  // docs/DELIVERY-SHAPES.md and DECISIONS.md#archive-normalizer /
  // #control-file-gate for what each field actually does; validated here
  // with the exact same function feeds.yml load calls
  // (context.resolve_delivery_config), so a typo fails in the form instead
  // of at the next Airflow parse.
  const deliveryKind = el("select", {}, [
    el("option", {value: "file",
                  selected: (f?.delivery?.kind ?? "file") === "file" ? "selected" : null},
       "plain file"),
    el("option", {value: "archive",
                  selected: f?.delivery?.kind === "archive" ? "selected" : null},
       "zip archive"),
  ]);
  const memberPattern = el("input", {class: "mono",
    value: f?.delivery?.member_pattern ?? "", placeholder: "positions_.*\\.csv"});
  const controlPattern = el("input", {class: "mono",
    value: f?.delivery?.control?.pattern ?? "", placeholder: "{stem}\\.ctl"});
  const controlRowCount = el("input", {class: "mono",
    value: f?.delivery?.control?.row_count ?? "",
    placeholder: "ROWS=(?P<rows>\\d+)  (optional)"});
  const controlMd5 = el("input", {class: "mono",
    value: f?.delivery?.control?.md5 ?? "",
    placeholder: "MD5=(?P<md5>[0-9a-fA-F]{32})  (optional)"});

  // HOW the control file is read -- ONE widget for BOTH control blocks. The
  // gate promotes the control file into landing/ byte for byte, so the two
  // blocks parse the same bytes and context.check_gates_are_coherent refuses
  // two readings of them. Writing one answer into both is how the form makes
  // that collision unreachable rather than an error to be understood.
  const ctlFormat0 = f?.delivery?.control?.format ?? f?.arrival?.control?.format;
  const isDelimited0 = ctlFormat0?.kind === "delimited";
  const ctlFormat = el("select", {}, [
    el("option", {value: "regex", selected: isDelimited0 ? null : "selected"},
       "text \u2014 a pattern per field"),
    el("option", {value: "delimited", selected: isDelimited0 ? "selected" : null},
       "delimited \u2014 a column per field"),
  ]);
  const ctlDelimiter = el("input", {class: "mono", style: "max-width:90px",
    value: ctlFormat0?.delimiter ?? "|", placeholder: "|"});
  const ctlColumns = el("input", {class: "mono",
    value: (ctlFormat0?.columns ?? []).join(", "),
    placeholder: "leave blank when the file has a header row"});
  const ctlFormatFields = el("div", {}, [
    el("div", {class: "field", style: "margin-top:10px"}, [
      el("label", {}, "Delimiter"),
      ctlDelimiter,
      el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
        "One character, and NOT inherited from the data file's delimiter " +
        "above \u2014 a comma-separated file routinely arrives beside a " +
        "pipe-separated control file. Reading a pipe file as commas does not " +
        "fail: it finds one column whose name is the whole header line, and " +
        "every field below then reports as missing."),
    ]),
    el("div", {class: "field", style: "margin-top:10px"}, [
      el("label", {}, "Column names (only if the file has no header row)"),
      ctlColumns,
      el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
        "Comma-separated, in the order the sender writes them. Leave blank " +
        "for the usual case, where the file's own header row names them \u2014 " +
        "one source for the names, or a sender who reorders the columns is " +
        "read against a stale list and every field finds the wrong value."),
    ]),
  ]);

  const memberPatternField = el("div", {class: "field", style: "margin-top:10px"}, [
    el("label", {}, "Member pattern"),
    memberPattern,
    el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
      "Which members inside the zip belong to this feed, required -- a zip " +
      "routinely carries a checksum, a manifest or another feed's file " +
      "alongside the data, and a wrong guess would silently ingest the wrong " +
      "files. Every member is assumed to share the delivery's COB date, " +
      "read from the CONTAINER's own filename above -- member- or " +
      "path-sourced dates are described in DELIVERY-SHAPES.md but not built."),
  ]);
  const controlPatternField = el("div", {class: "field", style: "margin-top:10px"}, [
    el("label", {}, "Control file pattern (optional)"),
    controlPattern,
    el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
      "A regex with {stem} standing for this delivery's own filename minus its " +
      "extension, e.g. '{stem}\\.ctl' for TRADE_20260901.ctl next to " +
      "TRADE_20260901.csv. Leave blank for an ordinary feed with no control " +
      "file. While set, a delivery is not normalized until a sibling matching " +
      "this pattern has also landed -- not a failure, a late feed."),
  ]);
  const controlMd5Label = el("label", {}, "Checksum pattern (optional)");
  const controlRowCountLabel = el("label", {}, "Declared row count pattern (optional)");
  const controlMd5Field = el("div", {class: "field", style: "margin-top:10px"}, [
    controlMd5Label,
    controlMd5,
    el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
      "A regex with a named group (?P<md5>...) read from the control file, " +
      "checked at ingest against the md5 of the delivery as landed. Catches " +
      "what the row count cannot: a file truncated or re-encoded in transit " +
      "that still holds the right NUMBER of rows. A mismatch abandons the " +
      "build branch and leaves main untouched."),
  ]);
  const controlRowCountField = el("div", {class: "field", style: "margin-top:10px"}, [
    controlRowCountLabel,
    controlRowCount,
    el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
      "A regex with a named group (?P<rows>...) to read the EXACT row count out " +
      "of the control file's contents, checked against the count actually read " +
      "at ingest -- next to the expected_min_rows floor below, not instead of " +
      "it. Leave blank for a control file that only gates readiness."),
  ]);

  const ctlFormatField = el("div", {class: "field", style: "margin-top:10px"}, [
    el("label", {}, "Control file format"),
    ctlFormat,
    el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
      "How the control file is READ, for both gates \u2014 the inbox promotes " +
      "it into landing/ unchanged, so one file, one answer. Text is the " +
      "default and the original: every field below is a regex over the " +
      "file's whole contents with one named group. Delimited is for a file " +
      "that is a small table \u2014 a header row and one row of values \u2014 " +
      "where every field below names a COLUMN instead. A regex can express " +
      "that shape and has to count the fields before the one it wants, so a " +
      "column inserted upstream reads the wrong value rather than failing."),
  ]);

  // The fields below name a regex or a column depending on the format, and a
  // label saying "pattern" over a box wanting RECORD_COUNT is worse than no
  // label. Retitled rather than duplicated: it is the same setting either way.
  function syncControlFormat() {
    const delimited = ctlFormat.value === "delimited";
    ctlFormatFields.style.display = delimited ? "" : "none";
    arrCtlDateLabel.textContent = delimited ? "COB date column" : "COB date pattern";
    arrCtlDateHelp.style.display = delimited ? "none" : "";
    arrCtlDate.placeholder = delimited
      ? "BUSINESS_DATE" : "ReportingDate\\|(?P<cob_date>\\d{8})";
    controlRowCountLabel.textContent = delimited
      ? "Declared row count column (optional)"
      : "Declared row count pattern (optional)";
    controlRowCount.placeholder = delimited
      ? "RECORD_COUNT  (optional)" : "ROWS=(?P<rows>\\d+)  (optional)";
    controlMd5Label.textContent = delimited
      ? "Checksum column (optional)" : "Checksum pattern (optional)";
    controlMd5.placeholder = delimited
      ? "FILE_HASH  (optional)" : "MD5=(?P<md5>[0-9a-fA-F]{32})  (optional)";
  }
  ctlFormat.addEventListener("change", syncControlFormat);
  syncControlFormat();

  function syncDeliveryVisibility() {
    const isArchive = deliveryKind.value === "archive";
    memberPatternField.style.display = isArchive ? "" : "none";
    // Gating an archive on a control file is described in DELIVERY-SHAPES.md
    // but NOT BUILT -- context.resolve_delivery_config rejects the
    // combination, so the form does not offer it rather than let someone
    // fill it in and hit that error at save.
    controlPatternField.style.display = isArchive ? "none" : "";
    ctlFormatField.style.display = isArchive ? "none" : "";
    ctlFormatFields.style.display =
      isArchive || ctlFormat.value !== "delimited" ? "none" : "";
    controlRowCountField.style.display = isArchive ? "none" : "";
    controlMd5Field.style.display = isArchive ? "none" : "";
  }
  deliveryKind.addEventListener("change", syncDeliveryVisibility);
  syncDeliveryVisibility();

  node.append(
    field("delivery", "Delivery shape", deliveryKind,
      "Plain file: one object, one delivery -- the ordinary case. Zip archive: a " +
      "dated container holding one or more members, exploded into ready/ at " +
      "normalize time."),
    memberPatternField, controlPatternField, ctlFormatField, ctlFormatFields,
    controlRowCountField, controlMd5Field,
  );

  // ------------------------------------------------------------- columns
  const colsBox = el("div");
  const addColRow = (nm = "", ty = "", src = "") => {
    const cn = el("input", {class: "mono", value: nm, placeholder: "column_name"});
    // The name this column has IN THE FILE, when that is not a usable
    // identifier. Blank means they are the same, which is most columns.
    // See docs/DECISIONS.md#source-column-names
    const cs = el("input", {class: "mono", value: src,
                            placeholder: "source header (if different)"});
    const ct = el("select", {}, STATE.types.map(t =>
      el("option", {value: t, selected: t === ty ? "selected" : null}, t)));
    // A type the PERSON picked is never overwritten by the inference below.
    // Without this flag, typing a column name after choosing its type would
    // silently undo the choice -- which is the same class of bug as the API
    // re-inferring on every read.
    ct._touched = !!ty;
    ct.addEventListener("change", () => { ct._touched = true; });
    // Infer on blur, not just on CSV upload, or hand-typed "+ column" rows
    // default to `string` forever while the same names read from a CSV header
    // get inferred properly.
    cn.addEventListener("blur", async () => {
      const v = cn.value.trim();
      if (!v || ct._touched) return;
      try {
        const r = await jpost("/api/infer-types", {columns: [v]});
        const guess = r.column_types[v];
        if (guess) ct.value = guess;     // still not _touched: a later edit wins
      } catch (_) { /* inference is a convenience; never block typing */ }
      refreshKeyChoices();
    });
    cn.addEventListener("input", refreshKeyChoices);
    const row = el("div", {class: "colrow"}, [cn, cs, ct,
      el("button", {class: "act", onclick: () => { row.remove(); refreshKeyChoices(); }}, "×")]);
    row._name = cn; row._type = ct; row._source = cs;
    colsBox.append(row);
    return row;
  };
  for (const c of (f?.columns ?? []))
    addColRow(c, (f?.column_types ?? {})[c] ?? "", (f?.source_columns ?? {})[c] ?? "");

  // `raw` is the actual character sniff_csv detected -- a real tab, not the
  // two-character "\t" the form's own DELIMS list and `readDelim()` use to
  // display one. Same conversion `applyPaste` below already does the other
  // way.
  function setDelimiterField(raw) {
    const shown = raw === "\t" ? "\\t" : raw;
    const known = DELIMS.some(([v]) => v === shown);
    delim.value = known ? shown : "";
    delimOther.value = known ? "" : shown;
    syncDelim();
  }

  const upload = el("input", {type: "file",
    accept: ".csv,.txt,.dat,.zip,text/csv,text/plain,application/zip"});
  const sniffNote = el("div", {class: "sub", style: "font-size:12px;margin-top:6px"});
  upload.addEventListener("change", async () => {
    if (!upload.files.length) return;
    const fd = new FormData();
    fd.append("file", upload.files[0]);
    // /api/sniff reads real VALUES -- delimiter, quote, header, encoding and
    // per-column types from what the file actually contains, not from what
    // was already typed into the form -- see docs/DECISIONS.md#the-sniffer.
    // /api/infer-columns (header names only) is still there for anything
    // sniff_csv cannot make sense of, but the form itself no longer calls it.
    let r;
    try { r = await api("/api/sniff", {method: "POST", body: fd}); }
    catch (err) {
      sniffNote.textContent = "✗ " + err.message;
      sniffNote.style.color = "var(--bad)";
      return;
    }
    setDelimiterField(r.delimiter);
    quote.value = r.quote_char;
    encoding.value = r.file_encoding;
    hasHeader.checked = r.header;
    colsBox.textContent = "";
    for (const c of r.columns)
      addColRow(c, r.column_types[c], (r.source_columns || {})[c] || "");
    refreshKeyChoices();
    if (!pattern.value.trim() && r.filename_pattern) pattern.value = r.filename_pattern;

    const bits = [];
    if (r.arrival_source_pattern) {
      // Switch the form into the shape that fits rather than leaving the
      // pattern box empty with no hint about why nothing was derived.
      hasArrival.checked = true;
      if (!sourcePattern.value.trim())
        sourcePattern.value = r.arrival_source_pattern;
      syncArrivalVisibility();
      bits.push("this filename carries no 8-digit date, so it cannot land " +
        "under it. Turned on Arrival and pre-filled the upstream pattern — " +
        "now set the landing filename pattern above to the name you want " +
        "(e.g. myfeed_(?P<cob_date>\\d{8})\\.csv) and give the COB " +
        "date pattern in the control file");
    }
    if (r.business_key_candidates && r.business_key_candidates.length)
      bits.push("business key candidate(s): " + r.business_key_candidates.join(", "));
    if (r.encoding_confidence === "low")
      bits.push(`encoding guessed as ${r.file_encoding} -- low confidence, double-check it`);
    if (r.archive_members) {
      deliveryKind.value = "archive";
      if (r.member_pattern_candidate) memberPattern.value = r.member_pattern_candidate;
      syncDeliveryVisibility();
      bits.push(`archive: ${r.archive_members.length} member(s), sniffed from ` +
        `"${r.sniffed_member}". Member pattern pre-filled below -- ` +
        (r.member_pattern_candidate
          ? `check it actually picks out the data members, not the whole archive.`
          : `nothing to guess it from, fill it in by hand.`));
      if (!r.container_has_date)
        bits.push("the container's filename has no 8-digit date -- " +
          "cob_date_from: container, the only value this platform reads, " +
          "will not work for it, so this feed cannot be onboarded until it has " +
          "one");
    }
    sniffNote.textContent = "Sniffed from real values." + (bits.length ? " " + bits.join(" · ") : "");
    sniffNote.style.color = "var(--muted)";
  });

  // Paste a header row instead of clicking "+ column" once per column. The
  // API has accepted a comma/whitespace-separated STRING for `columns` all
  // along (FeedSpec.from_payload._list splits one); only this form insisted on
  // a row at a time, which made eight columns eight clicks plus eight
  // focus-and-type cycles.
  const paste = el("input", {class: "mono",
    placeholder: "paste the file's header row: Trade Id|Cpty Ref|Notional (USD)"});
  const applyPaste = async () => {
    // Split on the feed's DELIMITER first. Splitting on whitespace turns a
    // real header — `Trade Id|Cpty Ref` — into four columns, which is the
    // shape of every header worth pasting. Comma next, whitespace only when
    // neither is present, which is the "type me a list of clean names" case
    // this box was originally for.
    const raw = paste.value;
    const d = readDelim() === "\\t" ? "\t" : readDelim();
    let parts;
    if (d && raw.includes(d)) parts = raw.split(d);
    else if (raw.includes(",")) parts = raw.split(",");
    else parts = raw.split(/\s+/);
    const headers = parts.map(x => x.trim()).filter(Boolean);
    if (!headers.length) return;
    let r;
    try { r = await jpost("/api/columns-from-header", {headers}); }
    catch (_) { return; }
    const existing = new Set(Object.keys(readTypes()));
    for (const c of r.columns)
      if (!existing.has(c))
        addColRow(c, r.column_types[c] || "", (r.source_columns || {})[c] || "");
    paste.value = "";
    refreshKeyChoices();
  };
  paste.addEventListener("keydown", (e) => {
    if (e.key === "Enter") { e.preventDefault(); applyPaste(); }
  });

  node.append(el("div", {class: "field"}, [
    el("label", {}, "Columns — the declared contract, in file order"),
    el("div", {class: "sub", style: "font-size:12px;margin-bottom:8px"},
      "Not discovered from the file: a column in the file but not here lands in " +
      "_extra_columns; one here but not in the file lands as NULL. Both are reported " +
      "as drift. The type says what the PREPARED model does with the column — raw " +
      "stays all strings — and a type you change is recorded in feeds.yml, so the " +
      "sample-data generator uses the same one."),
    colsBox,
    el("div", {class: "row"}, [
      el("button", {class: "act", onclick: () => { addColRow(); refreshKeyChoices(); }}, "+ column"),
      el("span", {class: "sub", style: "font-size:12px"}, "or sniff a real delivery (csv or zip):"),
      el("div", {style: "flex:1;min-width:200px"}, upload),
    ]),
    sniffNote,
    el("div", {class: "row", style: "margin-top:6px"}, [
      el("div", {style: "flex:1;min-width:240px"}, paste),
      el("button", {class: "act", onclick: applyPaste}, "add list"),
    ]),
    el("div", {class: "sub", style: "font-size:12px;margin-top:4px"},
       "Paste a whole header row (comma or space separated) and press Enter. Types are " +
       "guessed from each name; existing columns are left alone."),
    (errBoxes["columns"] = el("div", {class: "err"})),
  ]));

  // Business key: chosen FROM the declared columns rather than retyped. It has
  // to be a subset of them -- dedupe_rank partitions by it -- and that was
  // enforced server-side with a good message, which is still one round trip
  // and one re-read of the form to discover something the page already knew.
  const bkeyBox = el("div", {class: "row"});
  const bkeyExtra = el("div", {class: "sub", style: "font-size:12px;margin-top:4px"});
  let bkeySelected = new Set(f?.business_key ?? []);
  function refreshKeyChoices() {
    const cols = Object.keys(readTypes());
    bkeyBox.textContent = "";
    for (const c of cols) {
      const cb = el("input", {type: "checkbox"});
      cb.checked = bkeySelected.has(c);
      cb.addEventListener("change", () => {
        if (cb.checked) bkeySelected.add(c); else bkeySelected.delete(c);
      });
      bkeyBox.append(el("label", {class: "sub",
        style: "display:flex;gap:6px;align-items:center;margin:0"},
        [cb, el("span", {class: "mono"}, c)]));
    }
    if (!cols.length) bkeyBox.append(el("span", {class: "sub"}, "declare a column first"));
    // A key naming a column that no longer exists is shown rather than quietly
    // dropped: it is the state that makes dedupe_rank reference a column the
    // raw table does not have, and it should be visible, not tidied away.
    const orphans = [...bkeySelected].filter(k => !cols.includes(k));
    bkeyExtra.textContent = orphans.length
      ? `not in columns any more: ${orphans.join(", ")} — untick or re-add the column`
      : "";
    bkeyExtra.style.color = orphans.length ? "var(--bad)" : "";
  }

  node.append(
    field("business_key", "Business key", el("div", {}, [bkeyBox, bkeyExtra]),
      "What dedupe_rank partitions by, and what the uniqueness test is written over."),
    el("div", {class: "grid2"}, [
      field("expected_min_rows", "Expected minimum rows", minRows,
        "Aborts the ingest below this count, leaving main untouched. Set it to something " +
        "an empty or truncated delivery would fail, not to the expected row count."),
      field("cadence", "Cadence", cadence,
        "weekly stops the gap check reporting every non-delivery day as a gap."),
    ]),
    el("div", {class: "grid2"}, [
      field("schema_drift", "Schema drift", drift,
        "warn lands the file and records the drift; fail aborts the load. warn is usually " +
        "right — a rejected file is a file nobody looks at."),
      el("div", {class: "field"}, [
        el("label", {}, "Delivery expected"),
        el("div", {class: "row"}, [deliveryExpected,
          el("span", {class: "sub", style: "font-size:12px"},
             "Whether a delivery is expected on every COB date. Unchecked opts the " +
             "feed out of gap detection entirely (monthly or ad-hoc feeds).")]),
      ]),
    ]),
    el("div", {class: "grid2"}, [
      field("expected_by", "Expected by", expectedBy,
        "Wall-clock time (HH:MM, UTC) the upstream commits to, judged on the day AFTER the " +
        "COB date. Leave blank to assert no deadline \u2014 the lateness check then skips " +
        "the feed rather than inventing an expectation for it."),
      field("retention_class", "Retention class", retentionClass,
        "How long this feed's landing and quarantine evidence is kept. The windows live in " +
        "retention.yml; a class shorter than a report's tag window is refused for any feed " +
        "that report is built from."),
    ]),
    el("div", {class: "grid2"}, [
      field("delimiter", "Delimiter", el("div", {class: "row"}, [delim, delimOther]),
        "Becomes Spark's `sep`, which takes a single character. A wrong one does not fail \u2014 " +
        "it lands one column holding the whole row. Only written to feeds.yml when it is not a comma."),
      field("quote_char", "Quote character", quote,
        "Leave as \" unless the source quotes with something else."),
    ]),
    el("div", {class: "grid2"}, [
      field("file_encoding", "File encoding", encoding,
        "utf-8 unless the source says otherwise \u2014 latin-1 and cp1252 are the usual others."),
      el("div", {class: "field"}, [
        el("label", {}, "Header row"),
        el("div", {class: "row"}, [hasHeader,
          el("span", {class: "sub", style: "font-size:12px"},
             "Unchecked means the first line is data. Column names then come only from the list below.")]),
      ]),
    ]),
  );

  // Only the columns whose file header differs -- sparse, like the types, so
  // an ordinary feed writes no source_columns at all.
  const readSources = () => {
    const out = {};
    for (const row of colsBox.children) {
      const n = row._name.value.trim(), s = (row._source.value || "").trim();
      if (n && s && s !== n) out[n] = s;
    }
    return out;
  };

  const readTypes = () => {
    const out = {};
    for (const row of colsBox.children)
      if (row._name && row._name.value.trim()) out[row._name.value.trim()] = row._type.value;
    return out;
  };

  // Mirrors ui.registry._delivery_from_payload: blanks are dropped here too,
  // so submitting the form twice without touching these fields produces the
  // same {} (or the same archive/control shape) both times.
  // Mirrors ui.registry._arrival_from_payload: blanks dropped, and an
  // unchecked box sends {} rather than a half-filled block, so toggling it
  // off genuinely removes the feed's arrival: block on the next save.
  // The SAME object into both control blocks -- see the widget's comment.
  // Null when the format is the default, so an ordinary feed's block keeps
  // the shape it has always had in the diff.
  const readControlFormat = () => {
    if (ctlFormat.value !== "delimited") return null;
    const out = {kind: "delimited", delimiter: ctlDelimiter.value};
    const cols = ctlColumns.value.split(",").map(c => c.trim()).filter(Boolean);
    if (cols.length) out.columns = cols;
    // Not offered as a field -- a control file's quoting is almost never
    // interesting -- but carried through, or editing a feed in the form
    // would silently drop one somebody set by hand in feeds.yml.
    if (ctlFormat0?.quote_char) out.quote_char = ctlFormat0.quote_char;
    return out;
  };

  const readArrival = () => {
    if (!hasArrival.checked) return {};
    const out = {};
    const sp = sourcePattern.value.trim();
    if (sp) out.source_pattern = sp;
    const control = {};
    for (const [k, input] of [["pattern", arrCtlPattern],
                              ["cob_date", arrCtlDate]]) {
      const v = input.value.trim();
      if (v) control[k] = v;
    }
    const fmt = readControlFormat();
    if (fmt && Object.keys(control).length) control.format = fmt;
    if (Object.keys(control).length) out.control = control;
    return out;
  };

  const readDelivery = () => {
    if (deliveryKind.value === "archive") {
      const d = {kind: "archive"};
      if (memberPattern.value.trim()) d.member_pattern = memberPattern.value.trim();
      return d;
    }
    const pat = controlPattern.value.trim();
    if (!pat) return {};
    const control = {pattern: pat};
    const fmt = readControlFormat();
    if (fmt) control.format = fmt;
    const rc = controlRowCount.value.trim();
    if (rc) control.row_count = rc;
    const md5 = controlMd5.value.trim();
    if (md5) control.md5 = md5;
    return {control};
  };

  refreshKeyChoices();

  return {
    node,
    readTypes,
    read: () => ({
      name: name.value.trim(),
      description: desc.value.trim(),
      source_system: src.value.trim(),
      filename_pattern: pattern.value,
      business_key: [...bkeySelected],
      columns: Object.keys(readTypes()),
      column_types: readTypes(),
      source_columns: readSources(),
      expected_min_rows: Number(minRows.value || 0),
      cadence: cadence.value,
      schema_drift: drift.value,
      convention: convention.value,
      delivery_expected: deliveryExpected.checked,
      expected_by: expectedBy.value.trim(),
      retention_class: retentionClass.value,
      delimiter: readDelim(),
      quote_char: quote.value,
      file_encoding: encoding.value.trim(),
      header: hasHeader.checked,
      delivery: readDelivery(),
      arrival: readArrival(),
    }),
    clearErrors: () => Object.values(errBoxes).forEach(e => e.textContent = ""),
    showErrors: (err) => {
      Object.values(errBoxes).forEach(e => e.textContent = "");
      const errs = err.body && err.body.errors;
      if (!errs) { alert(err.message); return; }
      for (const [k, v] of Object.entries(errs))
        if (errBoxes[k]) errBoxes[k].textContent = v;
        else alert(`${k}: ${v}`);
    },
  };
}

// ------------------------------------------------------------ new feed
// `draft` pre-fills the form from a sniffed proposal (see showUnclaimed
// below) -- everything feedForm already reads off `f?.xxx` for an existing
// feed works unchanged for a proposal shaped the same way. Business key
// CANDIDATES are shown as a note, never auto-selected: several independently
// -unique columns is not the same claim as "together they are the key".
function newFeed(draft) {
  STATE.selected = null;
  loadFeeds();
  const d = $("#detail");
  d.textContent = "";
  d.append(el("h2", {}, "New feed"),
           el("div", {class: "sub"},
              "Writes feeds.yml, the dbt source, a prepared model and its tests — the " +
              "five files in docs/ADDING-A-FEED.md."));
  if (draft) {
    // feedForm reads `f ? f.delivery_expected : true` (a truthy-f check, not
    // `f?.delivery_expected ?? true`), so a draft that never sets
    // `delivery_expected` -- sniffing has no opinion on delivery cadence --
    // would silently uncheck it rather than default it, opting the new feed
    // OUT of the gap check with nothing on screen explaining why.
    if (draft.delivery_expected === undefined) draft.delivery_expected = true;
    const bits = [`Pre-filled by sniffing "${draft._sniffedFrom}".`];
    if (draft.business_key_candidates && draft.business_key_candidates.length)
      bits.push("business key candidate(s): " + draft.business_key_candidates.join(", "));
    if (draft.encoding_confidence === "low")
      bits.push(`encoding guessed as ${draft.file_encoding} -- low confidence, double-check it`);
    if (draft.arrival_source_pattern) {
      // Same shape readArrival() builds, so feedForm's f?.arrival?.* reads
      // pick it up unchanged -- see the archive branch below.
      draft.arrival = {source_pattern: draft.arrival_source_pattern,
                       control: {pattern: "{stem}\\.ctl"}};
      bits.push(`"${draft._sniffedFrom}" carries no 8-digit date, so it ` +
        "cannot land under that name. Turned on Arrival and pre-filled the " +
        "upstream pattern — set the landing filename pattern to the name you " +
        "want, and give the COB date pattern found in the control file");
    }
    if (draft.archive_members) {
      // feedForm reads f?.delivery?.kind / f?.delivery?.member_pattern --
      // build that shape from the sniff proposal's own fields before handing
      // the draft to it, the same way readDelivery() builds it from the form.
      draft.delivery = {kind: "archive", member_pattern: draft.member_pattern_candidate || ""};
      bits.push(`archive: ${draft.archive_members.length} member(s), sniffed from ` +
        `"${draft.sniffed_member}". Member pattern pre-filled below -- ` +
        (draft.member_pattern_candidate
          ? "check it actually picks out the data members, not the whole archive."
          : "nothing to guess it from, fill it in by hand."));
      if (!draft.container_has_date)
        bits.push("the container's filename has no 8-digit date -- " +
          "cob_date_from: container, the only value this platform reads, " +
          "will not work for it, so this feed cannot be onboarded until it has one");
    }
    d.append(el("div", {class: "note"}, bits.join(" · ")));
  }
  const form = feedForm(draft ?? null, true);
  d.append(form.node);
  const out = el("div");
  d.append(el("div", {class: "row"}, [
    el("button", {class: "act primary", onclick: async (e) => {
      await withBusy(e.target, async () => {
        try {
          const r = await jpost("/api/feeds", form.read());
          form.clearErrors();
          renderSteps(out, r.steps);
          renderValidation(out, r.validation);
          await loadFeeds(r.feed.name);
          out.append(el("div", {class: "note"},
            `Registered. Airflow generates ingest_${r.feed.name} on its next parse of ` +
            `feed_ingest.py — about 30 seconds. Then use the Data tab to upload a CSV ` +
            `and land it, and the Run tab to ingest.`));
          setTimeout(() => selectFeed(r.feed.name, "data"), 1200);
        } catch (err) { form.showErrors(err); }
      });
    }}, "Create feed"),
  ]), out);
}

// ------------------------------------------------------ unclaimed deliveries
// docs/DELIVERY-SHAPES.md#5-onboard-from-a-real-file: "the moment a new feed
// actually appears in real life -- not as a ticket, as a file nobody
// expected." Files in the inbox's `.rejected/` folder -- landed nowhere,
// claimed by no feed's filename_pattern or control pattern.
async function showUnclaimed() {
  STATE.selected = null;
  loadFeeds();
  const d = $("#detail");
  d.textContent = "";
  d.append(el("h2", {}, "Unclaimed deliveries"),
           el("div", {class: "sub"},
              "Files dropped into the inbox that matched no feed's filename_pattern " +
              "or control pattern, so they were moved to .rejected/ instead of landing. " +
              "Sniff one to pre-fill a new feed from its real values."));
  const box = el("div", {class: "scroll", style: "margin-top:14px"});
  d.append(box);
  let data;
  try { data = await api("/api/unclaimed"); }
  catch (err) { box.append(el("div", {class: "note warn"}, err.message)); return; }
  const items = data.unclaimed || [];
  if (!items.length) {
    box.append(el("div", {class: "empty"}, "Nothing unclaimed right now."));
    return;
  }
  const table = el("table");
  table.append(el("tr", {}, [
    el("th", {}, "File"), el("th", {}, "Size"), el("th", {}, "Why it was rejected"), el("th", {}),
  ]));
  for (const it of items) {
    const status = it.now_claimed_by
      ? el("span", {class: "pill ok"}, `now claimed by ${it.now_claimed_by}`)
      : it.now_routes_as_control
      ? el("span", {class: "pill warn"}, "now routes as a control file")
      : el("span", {class: "sub"}, it.reason || "");
    const btn = el("button", {class: "act primary"}, "Sniff → New feed");
    btn.disabled = !!(it.now_claimed_by || it.now_routes_as_control);
    if (btn.disabled)
      btn.title = "feeds.yml has changed since this was rejected -- drop it into the inbox again instead of sniffing it here.";
    btn.addEventListener("click", (e) => sniffUnclaimed(it.filename, e.target));
    table.append(el("tr", {}, [
      el("td", {class: "mono"}, it.filename),
      el("td", {}, `${it.bytes} B`),
      el("td", {}, status),
      el("td", {}, btn),
    ]));
  }
  box.append(table);
}

async function sniffUnclaimed(filename, btn) {
  await withBusy(btn, async () => {
    try {
      const r = await jpost(`/api/unclaimed/${encodeURIComponent(filename)}/sniff`);
      newFeed({...r, _sniffedFrom: filename});
    } catch (err) { alert(err.message); }
  });
}

// ------------------------------------------------------------------ arrivals
// THE JOURNEY OF ONE FILE: inbox -> landing -> checks -> ingest run. Every
// value here is read from something that already records that leg of it (the
// delivery registry, the rejection registry, the inbox folder, Airflow) --
// see reporting_platform/ui/arrivals.py. Nothing on these pages is written
// anywhere, and nothing here decides anything.

const ts = (iso) => (iso || "").replace("T", " ").slice(0, 19) || "—";
const short = (s, n=44) => !s ? "" : s.length <= n ? s : s.slice(0, n - 1) + "…";

// What the ORIGIN column means, spelled out, because the honest label is not
// the obvious one. `origin` is the registry's, and it records whether the
// CONFORMANCE GATE promoted the delivery -- not whether a human used the
// inbox. A conformant file dropped into `inbox/` is uploaded under its own
// name and needs no gate, so it lands as `direct`, exactly like one an
// approved sender PUT into the bucket. Calling that "not from the inbox"
// would be wrong; calling it "landed under its own name" is what happened.
const ORIGIN = {
  inbox: ["renamed by the gate",
          "promoted by the conformance gate: landed under a name " +
          "filename_pattern describes, with its control file and a metadata " +
          "sibling beside it"],
  direct: ["own name",
           "landed under the name it was sent with — by an approved sender " +
           "writing straight into landing/, or dropped into the inbox already " +
           "conformant, which needs no gate. `origin` records whether the " +
           "GATE promoted it, not which door it came through."],
};

function outcomePill(a) {
  if (a.kind === "rejection")
    return el("span", {class: "pill bad", title: a.reason || ""},
              "quarantined · " + (a.reason_class || "refused"));
  return el("span", {class: "pill ok"}, "landed");
}

// The integrity pair, and they are two different kinds of answer -- see
// arrivals.checks(). The checksum is comparable here (declared against what
// the landed object hashes to); the row count is not, because only Spark
// counts rows, so the DECLARED number is shown and the ingest run beside it
// is the verdict.
function checkPills(a) {
  const c = a.checks;
  if (!c) return el("span", {class: "muted"}, "—");
  const out = el("span", {class: "row", style: "gap:5px"});
  const rc = c.row_count || {};
  if (rc.verdict === "at_ingest")
    out.append(el("span", {class: "pill", title:
      "the control file declared " + rc.declared + " rows. Nothing counts " +
      "rows without reading the file, so ingest is what compares them -- and " +
      "fails the run on a mismatch. The ingest column is the verdict."},
      "rows: " + rc.declared + " declared"));
  const m = c.md5 || {};
  if (m.verdict === "ok")
    out.append(el("span", {class: "pill ok", title:
      "declared " + m.declared + "\nlanded   " + m.landed +
      "\n\nThe same comparison ingest makes, on the same recorded bytes. It " +
      "does not say an ingest has run."}, "md5 matches"));
  else if (m.verdict === "mismatch")
    out.append(el("span", {class: "pill bad", title:
      "declared " + m.declared + "\nlanded   " + m.landed +
      "\n\nThe file is not the file the sender checksummed. Ingest refuses " +
      "this delivery."}, "md5 MISMATCH"));
  else if (m.verdict === "not_comparable")
    out.append(el("span", {class: "pill warn", title:
      "a multi-part delivery with a declared checksum -- ingest hashes the " +
      "parts in order, which is not what the registry recorded for the " +
      "container."}, "md5 not comparable"));
  if (!out.childNodes.length)
    out.append(el("span", {class: "muted", title:
      "this feed's deliveries carry no control file, so nothing was declared " +
      "to check against. expected_min_rows still applies at ingest."},
      "nothing declared"));
  return out;
}

// A delivery Airflow no longer has a run for reads "no run recorded", never
// "not ingested". Airflow trims its own history and the registry does not, so
// the older half of this list will always outlive the runs that ingested it --
// and whether the rows reached raw is derived from `_source_file`, which costs
// a Spark job to ask. The state shown is the state of a RUN.
function ingestPill(a) {
  const g = a.ingest;
  if (a.kind === "rejection")
    return el("span", {class: "muted", title:
      "a refused delivery never reaches landing, so no ingest is triggered " +
      "for it. The bytes are in quarantine/ and the row in " +
      "registry.rejection."}, "not triggered");
  if (!g) return el("span", {class: "muted"}, "—");
  if (!g.available)
    return el("span", {class: "pill warn"}, "airflow unreachable");
  if (!g.runs.length)
    return el("span", {class: "muted", title:
      g.dag_known === false
        ? "Airflow has no DAG " + g.dag_id + " -- the feed is gone from " +
          "feeds.yml, or has not been parsed yet. The delivery is still in " +
          "the registry, which is what an index over object storage is for."
        : "no run of " + g.dag_id + " names this delivery. Airflow trims its " +
          "run history; the registry does not, so this is expected for an " +
          "older delivery and is not a claim that it was never ingested."},
      g.dag_known === false ? "no ingest DAG" : "no run recorded");
  const r = g.runs[0];
  return el("span", {class: "pill " + stateClass(r.state),
                     title: r.run_id + (r.note ? "\n" + r.note : "") +
                            "\nstarted " + ts(r.start_date) +
                            (g.runs.length > 1
                              ? "\n\n" + g.runs.length + " runs name this " +
                                "delivery; the newest is shown."
                              : "")}, r.state || "—");
}

async function showArrivals() {
  STATE.selected = null;
  loadFeeds();
  const d = $("#detail");
  d.textContent = "";
  d.append(
    el("h2", {}, "Arrivals"),
    el("div", {class: "sub"},
      "Every file this platform was offered, accepted or refused, newest " +
      "first — what it was called, which feed claimed it, what its control " +
      "file declared, and which ingest run followed. Assembled from the " +
      "delivery registry, the rejection registry, the inbox folder and " +
      "Airflow; nothing on this page is a record of its own."));
  const inbox = el("div", {style: "margin-top:16px"});
  const body = el("div");
  d.append(inbox, body);
  renderInbox(inbox);
  renderArrivals(body, {});
}

// What is at the door RIGHT NOW, classified by `inbox.route()` -- the gate's
// own function, so a file shown here as claimed by nobody is a file the next
// sweep will quarantine. That is the question this answers that nothing else
// did: a name nobody has onboarded looks exactly like a name about to be
// picked up, right until it is not.
async function renderInbox(target) {
  target.textContent = "";
  let s;
  try { s = await api("/api/inbox"); }
  catch (err) {
    target.append(el("div", {class: "note warn"}, "inbox: " + err.message));
    return;
  }
  target.append(el("h3", {}, "In the inbox now"));
  if (!s.present) {
    target.append(el("div", {class: "note warn"},
      "No inbox directory at " + s.path + "."));
    return;
  }
  if (!s.waiting.length) {
    target.append(el("div", {class: "note"},
      "Nothing waiting in " + s.path + ". " +
      (s.processed.length
        ? "Last through the gate: " + s.processed[0].filename + " (" +
          s.processed[0].feed + ", " + ts(s.processed[0].processed_at) + ")."
        : "")));
  } else {
    const t = el("table");
    t.append(el("thead", {}, el("tr", {}, [
      el("th", {}, "File"), el("th", {}, "Modified"), el("th", {}, "Size"),
      el("th", {}, "Claimed by"), el("th", {}, "How")])));
    const tb = el("tbody");
    for (const w of s.waiting) {
      const cls = {conformant: "ok", gated: "ok", control: "warn",
                   unroutable: "bad", ambiguous: "bad"}[w.classification] || "";
      tb.append(el("tr", {}, [
        el("td", {class: "mono"}, w.filename),
        el("td", {class: "muted"}, ts(w.modified_at)),
        el("td", {class: "muted"}, (w.bytes ?? 0) + " B"),
        el("td", {}, w.feed || el("span", {class: "muted"}, "nobody")),
        el("td", {}, el("span", {class: "pill " + cls,
                                 title: w.reason || ""}, w.classification)),
      ]));
    }
    t.append(tb);
    target.append(el("div", {class: "scroll"}, t));
    target.append(el("div", {class: "note"},
      "A file here has not necessarily been seen yet: the watcher wants " +
      s.stable_polls + " consecutive polls with an unchanged size and mtime " +
      "before it touches anything, so a file written seconds ago is meant to " +
      "still be sitting there. " +
      "conformant = already named the way landing requires · " +
      "gated = the upstream's own name, renamed by the gate · " +
      "control = a control file, held until its data file arrives · " +
      "unroutable/ambiguous = the next sweep quarantines it."));
  }
}

// One renderer, two callers: the Arrivals page and the per-feed Arrivals tab.
// `opts.feed` narrows it; everything else is identical, because a feed's
// arrivals and every feed's arrivals are the same question asked with a
// different filter and would drift if they were two tables.
async function renderArrivals(target, opts) {
  target.textContent = "";
  const controls = el("div", {class: "row", style: "margin:16px 0 8px"});
  const summary = el("div", {class: "row", style: "gap:6px;margin-bottom:8px"});
  // Taller than the shared .scroll cap: this table IS the page rather than a
  // panel on one, and 340px shows nine rows of a list whose header says fifty.
  const box = el("div", {class: "scroll", style: "max-height:62vh"});
  const limit = el("select", {}, [25, 50, 100, 250].map(v =>
    el("option", {value: v, selected: v === 50 ? "" : null}, v + " rows")));
  const refresh = el("button", {class: "act"}, "Refresh");
  controls.append(el("div", {}, [el("label", {}, "Show"), limit]), refresh);
  target.append(el("h3", {}, opts.feed ? "Arrivals for this feed" : "What arrived"),
                controls, summary, box);

  const draw = async () => {
    box.textContent = "";
    box.append(el("div", {class: "empty"}, "Loading…"));
    let data;
    try {
      data = await api("/api/arrivals?limit=" + limit.value +
                       (opts.feed ? "&feed=" + encodeURIComponent(opts.feed) : ""));
    } catch (err) {
      box.textContent = "";
      box.append(el("div", {class: "note warn"}, err.message));
      return;
    }
    summary.textContent = "";
    const c = data.counts || {};
    summary.append(
      el("span", {class: "pill" + (c.landed ? " ok" : "")}, c.landed + " landed"),
      el("span", {class: "pill" + (c.quarantined ? " bad" : "")},
         c.quarantined + " quarantined"),
      el("span", {class: "pill" + (c.md5_mismatch ? " bad" : "")},
         c.md5_mismatch + " checksum mismatch"),
      el("span", {class: "muted", style: "margin-left:6px"},
         c.declared + " of " + c.landed + " arrived with a checksum to check"));
    box.textContent = "";
    if (!data.arrivals.length) {
      box.append(el("div", {class: "empty"},
        "Nothing recorded yet. Drop a file into ./inbox, or use the Data tab."));
      return;
    }
    const t = el("table");
    t.append(el("thead", {}, el("tr", {}, [
      el("th", {}, "Arrived"), el("th", {}, "File"),
      ...(opts.feed ? [] : [el("th", {}, "Feed")]),
      el("th", {}, "Outcome"), el("th", {}, "COB"),
      el("th", {}, "Declared checks"), el("th", {}, "Ingest")])));
    const tb = el("tbody");
    for (const a of data.arrivals) {
      const name = el("span", {class: "mono", title: a.source_name || ""},
                      short(a.source_name));
      const fileCell = el("td", {}, [name]);
      // TWO FILENAMES AND THEY ARE DIFFERENT STRINGS for a gated delivery.
      // The upstream will only ever know the first one, so showing only the
      // landed name makes a delivery unfindable by what it was called.
      if (a.renamed)
        fileCell.append(el("div", {class: "sub mono", style: "font-size:11.5px",
                                   title: a.delivery_id},
                           "→ " + short(a.delivery_id)));
      if (a.source_container)
        fileCell.append(el("div", {class: "sub", style: "font-size:11.5px"},
                           "from " + short(a.source_container, 34)));
      const cells = [
        el("td", {class: "muted", title: "first seen by the registry " +
                                          ts(a.first_seen_at)}, ts(a.at)),
        fileCell,
        ...(opts.feed ? [] : [el("td", {}, a.feed
              || el("span", {class: "muted", title:
                    "nothing claimed this name, which is a rejection the " +
                    "registry can still describe -- and the commonest one."},
                    "unclaimed"))]),
        // The origin pill appears only for a delivery the GATE promoted.
        // `direct` is the overwhelming majority -- every feed with no
        // `arrival:` block -- and a pill saying so on all fifty rows is fifty
        // repetitions of the default dressed up as information. The renamed
        // pair under the filename is where a gated delivery already shows
        // itself; this names the mechanism. Both origins are spelled out on
        // the delivery's own page.
        el("td", {}, [outcomePill(a), " ",
                      a.origin === "inbox"
                        ? el("span", {class: "pill", title: ORIGIN.inbox[1]},
                             ORIGIN.inbox[0])
                        : ""]),
        el("td", {class: "muted"}, a.cob_date || "—"),
        el("td", {}, checkPills(a)),
        el("td", {}, ingestPill(a)),
      ];
      const tr = el("tr", {}, cells);
      if (a.kind === "delivery") {
        tr.style.cursor = "pointer";
        tr.title = "open this delivery";
        tr.addEventListener("click", () => showArrival(a.feed, a.delivery_id));
      }
      tb.append(tr);
    }
    t.append(tb);
    box.append(t);
  };
  limit.addEventListener("change", draw);
  refresh.addEventListener("click", (e) => withBusy(e.target, draw));
  await draw();
}

// One delivery, end to end. Opened from a row above; `back` returns to
// wherever it was opened from, because the per-feed tab and the global page
// are both legitimate places to have come from.
async function showArrival(feed, deliveryId) {
  const from = STATE.selected;
  const fromTab = STATE.tab;
  const d = $("#detail");
  d.textContent = "";
  d.append(el("div", {class: "empty"}, "Loading…"));
  let a;
  try { a = await api(`/api/arrivals/${encodeURIComponent(feed)}/` +
                      encodeURIComponent(deliveryId)); }
  catch (err) {
    d.textContent = "";
    d.append(el("div", {class: "note warn"}, err.message));
    return;
  }
  d.textContent = "";
  const back = el("button", {class: "act", onclick: () => {
    if (from) selectFeed(from, fromTab); else showArrivals();
  }}, "← Back");
  d.append(el("div", {class: "row"}, back),
           el("h2", {style: "margin-top:12px"}, a.delivery_id),
           el("div", {class: "sub"},
              a.feed + " · " + (a.source_system || "") + " · COB " + a.cob_date));

  const kv = (rows) => {
    const t = el("table");
    const tb = el("tbody");
    for (const [k, v, help] of rows) {
      if (v === null || v === undefined || v === "") continue;
      tb.append(el("tr", {}, [
        el("td", {class: "muted", style: "width:200px"}, k),
        el("td", {}, [el("span", {class: "mono"}, String(v)),
                      help ? el("div", {class: "sub", style: "font-size:11.5px"},
                               help) : ""]),
      ]));
    }
    t.append(tb);
    return t;
  };

  d.append(el("h3", {}, "Identity"), kv([
    ["what the upstream called it", a.source_name,
     a.renamed ? "different from the landed name: this delivery was renamed " +
                 "by the conformance gate, and the upstream knows only this one"
               : null],
    ["landed as", a.delivery_id],
    ["container", a.source_container,
     a.source_container ? "unpacked at the gate; the container itself is " +
                          "never landed" : null],
    ["how it got in", (ORIGIN[a.origin] || [a.origin])[0],
     (ORIGIN[a.origin] || ["", ""])[1]],
    ["control file", a.checks.control_object,
     "promoted into landing beside the delivery, never consumed -- which is " +
     "what lets the same verification run whichever way the delivery arrived"],
    ["arrived", ts(a.at)],
    ["first seen by the registry", ts(a.first_seen_at),
     "the gap between the two is how far behind the registry was running"],
    ["origin", a.origin_uri],
    ["schema version", a.schema_version,
     "the declared column contract this delivery was read against -- not the " +
     "shape of the file"],
    ["producer run", a.producer_run_id],
  ]));

  d.append(el("h3", {}, "Declared checks"), el("div", {}, checkPills(a)));
  d.append(el("div", {class: "note"},
    "THE INBOX ESTABLISHES IDENTITY; INGESTION VERIFIES INTEGRITY. " +
    (a.checks.control_object
      ? "The control file is promoted into landing beside the delivery, not " +
        "consumed, so the same verification runs whichever way the delivery " +
        "arrived: " + a.checks.control_object
      : "This delivery declared nothing to check against — no control file. " +
        "expected_min_rows still applies at ingest, and schema drift is " +
        "still reported.")));

  d.append(el("h3", {}, "The objects holding the rows"), kv([
    ["landing object", a.source_object, "the evidence copy"],
    ["manifest", a.manifest_key,
     "ready/ is the work queue and a days-long cache; landing keeps the " +
     "delivery for years, so a manifest that has expired is the designed " +
     "steady state, not a fault"],
    ["bytes", a.bytes],
  ]));
  if (a.part_objects && a.part_objects.length) {
    const t = el("table");
    t.append(el("thead", {}, el("tr", {}, [
      el("th", {}, "part"), el("th", {}, "object"), el("th", {}, "bytes")])));
    const tb = el("tbody");
    for (const p of a.part_objects)
      tb.append(el("tr", {}, [el("td", {class: "muted"}, p.part_no),
                              el("td", {class: "mono"}, p.object_key),
                              el("td", {class: "muted"}, p.bytes ?? "—")]));
    t.append(tb);
    d.append(t, el("div", {class: "sub", style: "margin-top:6px"},
      "`_source_file` in the raw table is the PART's key, so these are what " +
      "join a raw row back to this delivery."));
  }

  d.append(el("h3", {}, "Ingest"));
  const g = a.ingest || {};
  if (!g.available)
    d.append(el("div", {class: "note warn"},
      "Airflow could not be asked. " + (g.error || "")));
  else if (!g.runs.length)
    d.append(el("div", {class: "note"}, g.dag_known === false
      ? "Airflow has no DAG " + g.dag_id + ". The feed is gone from " +
        "feeds.yml or has not been parsed yet — the delivery is still here, " +
        "which is what an index over object storage is for."
      : "No run of " + g.dag_id + " names this delivery. Airflow trims its " +
        "run history and the registry does not, so an older delivery having " +
        "no run here is expected. Whether its rows are in raw is derived " +
        "from `_source_file` and costs a Spark job to ask — this page does " +
        "not guess at it."));
  else {
    const t = el("table");
    t.append(el("thead", {}, el("tr", {}, [
      el("th", {}, g.dag_id), el("th", {}, "state"), el("th", {}, "started"),
      el("th", {}, "ended"), el("th", {}, "triggered with")])));

# The config-level gate: everything about this platform that can be checked
# without starting it.
#
# WHY THIS IS THE CHEAP TIER AND WHAT IT DELIBERATELY OMITS. The stack is six
# services, an Iceberg catalog and a Spark cluster; a gate that needs them
# runs in tens of minutes and so runs rarely, and a gate that runs rarely is
# not a gate. All this tier needs is Python plus five packages -- no Spark,
# no dbt, no Docker, no catalog -- and answers in about ten seconds.
#
# What it therefore does NOT cover, so nobody reads a green tick as more than
# it is: `dbt parse`, DAG import and the cosmos `--no-deps` trap, all three of
# which need the image's dependency set and so moved to `parse.yml` -- THE
# TIER ABOVE, not a replacement for this one; and column-level lineage, which
# needs a built catalog and is gated nowhere yet. The image BUILD is still
# ungated too: `parse.yml` installs the same pins by hand, and
# `tests/test_ci_pins.py` -- which runs HERE -- is what stops the two copies
# drifting.
#
# `lineage --columns` is the one worth being explicit about, because this
# header used to say it RUNS here AND IT NEVER HAS -- there is no such step
# below, and adding one would be worse than leaving it out. Without compiled
# SQL and a catalog it reports 7 of 11 tables `not derivable`; for the other
# 4 it falls back to the feed's DECLARED columns, so every column it
# classifies is `sourced` by construction -- 28 of 28, measured. `unresolved`
# is the one thing `--columns` exits 1 on, and here it is UNREACHABLE: the
# step would be a tick that cannot fail. `--require-derivable` inverts it into
# a failure that can only ever mean "you have not built yet". Both belong to a
# post-build tier, and there is not one.
# See docs/DECISIONS.md#a-gate-that-cannot-fail
name: config

on:
  push:
    branches: [main]
  pull_request:

jobs:
  config:
    runs-on: ubuntu-latest
    env:
      # Both are read at import (common/settings.py, common/context.py), so
      # they are set for the job rather than per step. The defaults are the
      # container's paths, which do not exist on a runner -- without these
      # every check reports that the platform manages nothing.
      REPORTING_CONFIG_DIR: ${{ github.workspace }}/reporting_platform/config
      DBT_PROJECT_DIR: ${{ github.workspace }}/dbt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'          # the image's interpreter

      # NOT the image's requirements -- this is the whole dependency set the
      # config layer has, which is what makes this tier possible at all.
      # `tests/run.py` is written without pytest for the same reason, and the
      # suite passes with no sqlglot, pyspark, psycopg2, boto3 or dbt.
      #
      # DERIVED BY RUNNING IT IN A CLEAN VIRTUALENV, not by reading imports.
      # pyyaml and ruamel.yaml are the obvious two; `requests` comes in
      # through `common/nessie.py` (test_arrivals), and `duckdb` because
      # `test_sniff` imports it at MODULE level -- which aborts the whole run
      # rather than failing one test, so the suite exits 1 with no summary
      # line at all. The exit code is still right, which is what a gate needs.
      # Pinned to the image's duckdb for the reason the image pins it:
      # 1.1.3 cannot ATTACH an Iceberg catalog.
      #
      # `jinja2` because `test_dedupe_rank` renders `dbt/macros/engine.sql`
      # and the model files with it and runs the result in duckdb -- the
      # template engine dbt is built on, not dbt, which this tier still does
      # not install. Also a MODULE-LEVEL import, so the same whole-run abort
      # as duckdb without it. Pinned to what Airflow's constraint file gives
      # the image.
      - name: Install the config layer's dependencies
        run: |
          pip install --quiet \
            pyyaml "ruamel.yaml==0.18.6" requests "duckdb==1.5.5" "jinja2==3.1.5" boto3

      # The registry has to load before anything else is worth asking. Its own
      # step rather than relying on the suite, so a broken feed file reports
      # as "config" and not as whichever test happened to touch it first.
      - name: The registry loads
        run: python -m reporting_platform.config check

      - name: Config-level tests
        run: python -m tests.run
